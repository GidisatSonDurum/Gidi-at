<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şube Dashboard</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#111827; --muted:#5b6475; --line:#e3e7ee;
  --accent:#1f4fd8; --accent-soft:#e8eefc; --gray:#97a1b3; --amber:#d98a00; --teal:#0f9d8a;
  --good:#0d8a4b; --good-bg:#e4f6ec; --bad:#c62828; --bad-bg:#fdeaea; --warn:#9a6200; --warn-bg:#fff3d6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#0e1320; --card:#171e2f; --ink:#eef1f7; --muted:#9aa5ba; --line:#262f45;
  --accent:#6f95ff; --accent-soft:#1d2a4f; --gray:#7b869b; --amber:#f0b03a; --teal:#34c9b3;
  --good:#4fd18b; --good-bg:#12301f; --bad:#ff7b7b; --bad-bg:#3a1a1c; --warn:#f0b03a; --warn-bg:#35290d; --shadow:none;color-scheme:dark}
}
:root[data-theme=dark]{--bg:#0e1320; --card:#171e2f; --ink:#eef1f7; --muted:#9aa5ba; --line:#262f45;
  --accent:#6f95ff; --accent-soft:#1d2a4f; --gray:#7b869b; --amber:#f0b03a; --teal:#34c9b3;
  --good:#4fd18b; --good-bg:#12301f; --bad:#ff7b7b; --bad-bg:#3a1a1c; --warn:#f0b03a; --warn-bg:#35290d; --shadow:none;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
.thm{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:34px;font-size:17px;cursor:pointer;line-height:1}
@media (min-width:99999px){
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;overscroll-behavior-x:none}
body{margin:0;overflow-x:clip;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit}
select{font-size:16px}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;margin-right:auto}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.picker{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:6px;align-items:center;flex:1 1 280px;max-width:520px;min-width:0}
.selw{position:relative;min-width:0}
.selv{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 30px 5px 10px;min-height:38px;display:flex;flex-direction:column;justify-content:center;line-height:1.2;position:relative}
.selv::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.selv b{font-size:14px;overflow-wrap:anywhere}.selv small{font-size:11px;color:var(--muted);font-weight:600}
.picker select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px;width:100%;min-width:0;max-width:100%;text-overflow:ellipsis;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.picker button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:16px}
.nav{overscroll-behavior-x:contain;touch-action:pan-x pan-y;max-width:1280px;margin:0 auto;padding:0 14px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;color:var(--muted);background:var(--bg);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600}
.nav a:hover{color:var(--ink)}
main{max-width:1280px;margin:0 auto;padding:14px 14px 60px}
h2.grp{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:26px 2px 10px;display:flex;align-items:center;gap:10px}
h2.grp::after{content:"";height:1px;background:var(--line);flex:1}
.hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.kpi{padding:11px 13px;display:flex;flex-direction:column;gap:2px;min-height:96px}
.kpi.big{background:linear-gradient(135deg,var(--accent),#3a2fc4);color:#fff;border:0}
.kpi.big .lbl,.kpi.big .sub{color:rgba(255,255,255,.82)}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.val{font-size:26px;font-weight:750;letter-spacing:-.4px;line-height:1.15;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted);margin-top:auto;min-height:2.6em}
.kpi .row{min-height:22px}
.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{background:var(--good-bg);color:var(--good)} .dn{background:var(--bad-bg);color:var(--bad)} .wn{background:var(--warn-bg);color:var(--warn)} .nu{background:var(--bg);color:var(--muted)}
.kpi.big .chip{background:rgba(255,255,255,.18);color:#fff}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.info{padding:12px 14px;margin-top:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.info div span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.info div b{font-size:14px}
.gauge{grid-column:1/-1}
.gauge .bar{position:relative;height:8px;border-radius:99px;background:var(--bg);margin:8px 0 4px;overflow:visible}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.gauge .mk{position:absolute;top:-4px;width:2px;height:16px;background:var(--muted)}
.gauge .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.status .card{padding:11px 13px;display:flex;flex-direction:column;gap:6px}
.status .t{font-size:12px;color:var(--muted);font-weight:700}
.sec{margin-top:14px;overflow:hidden;scroll-margin-top:136px}
.sec-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;padding:13px 15px 4px}
.sec-h h3{margin:0;font-size:15px}
.sec-h .hv{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.sec-h .hv b{font-size:18px}
.sec-h .hv i{font-style:normal;color:var(--muted);font-size:11.5px}
.chart{padding:4px 10px 0}
.chart svg{width:100%;height:auto;display:block;max-width:1200px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 15px 8px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.tw{overflow-x:auto;overscroll-behavior-x:contain;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;background:var(--card)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;font-weight:600;box-shadow:1px 0 0 var(--line)}
td.tot,th.tot{font-weight:700;background:var(--accent-soft);color:var(--ink)}
td.dim{color:var(--muted)}
td.up{background:transparent;color:var(--good);font-weight:600} td.dn{background:transparent;color:var(--bad);font-weight:600} td.wn{background:transparent;color:var(--warn);font-weight:600}
td.tot.up,td.tot.dn,td.tot.wn{background:var(--accent-soft)}
.nodata{padding:14px 15px;color:var(--muted)}
.kt td:nth-child(n+2),.kt th:nth-child(n+2){text-align:right}
.lt th{cursor:pointer;user-select:none}
.lt th.s::after{content:attr(data-d);margin-left:4px;color:var(--accent)}
.lt tr.cl{cursor:pointer}
.lt tr.cl:hover td{background:var(--accent-soft)}
.lt tr.cl:hover td:first-child{background:var(--accent-soft)}
.lt tfoot td{font-weight:700;background:var(--bg);border-top:2px solid var(--line)}
.lt tfoot td:first-child{background:var(--bg)}
.lt th:first-child,.lt td:first-child{text-align:left;font-weight:600;min-width:128px;z-index:2}
.lt thead th:first-child{z-index:3}
.tabs{flex-wrap:wrap}
.tabs .sm{display:none}
.fbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;padding:10px 12px;margin-bottom:12px}
.fl{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fl select{font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:170px;text-transform:none;letter-spacing:0;font-weight:600}
.fl.inl{flex-direction:row;align-items:center;gap:6px}
.fn{margin-left:auto;color:var(--muted);font-size:12px;font-weight:600;align-self:center}
.rank{padding:10px 12px;margin-top:12px}
.rk-h{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rk-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px 12px}
.rk-g div{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.rk-g div>span:first-child{font-size:11px;color:var(--muted);font-weight:600}
.chipbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink)}
.rk{display:inline-block;min-width:22px;color:var(--muted);font-weight:600}
.foot{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
#err{padding:30px;text-align:center;color:var(--bad)}
@media (max-width:600px){
  .top-in{padding:6px 10px;gap:6px} .picker{flex:1 1 100%;max-width:none} .brand{flex:1 1 auto;font-size:14px;min-width:0} .brand small{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs button{padding:6px 7px;font-size:12px;white-space:nowrap;flex:1}
  .tabs .lg{display:none} .tabs .sm{display:inline}
  .fbar{padding:8px 10px;gap:6px 8px;margin-bottom:8px} .fl select{font-size:16px;max-width:none;width:100%} .fl{flex:1 1 30%;min-width:0} .rk-g{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px} .rank{padding:8px 10px;margin-top:8px}
  .lt td:first-child{white-space:normal;min-width:104px;max-width:128px;line-height:1.25}
  .picker{grid-template-columns:38px minmax(0,1fr) 38px} .selv{min-height:36px;padding:4px 26px 4px 9px} .selv b{font-size:13px} .selv small{font-size:10.5px} .picker button{height:36px;width:38px;padding:0;align-self:stretch;height:auto;min-height:36px}
  .nav{padding:0 10px 6px} .nav a{padding:4px 9px;font-size:11.5px}
  main{padding:8px 8px 40px}
  .hero{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
  .kpi{padding:6px 7px;min-height:0;gap:1px} .kpi.big{grid-column:span 2;padding:6px 7px}
  .val{font-size:14.5px;line-height:1.2;letter-spacing:-.3px} .lbl{font-size:8.5px;letter-spacing:.2px;line-height:1.2} .sub{font-size:9px;line-height:1.25;margin-top:1px;min-height:2.5em} .kpi .row{min-height:18px} .chip{font-size:9.5px;padding:0 5px} .kpi .row{gap:4px}
  .hero{gap:6px}
  .info{padding:8px 10px;gap:5px 8px;grid-template-columns:repeat(3,minmax(0,1fr))} .info div span{font-size:8.5px;letter-spacing:.2px} .info div b{font-size:12px;line-height:1.25;display:block;overflow-wrap:anywhere} .gauge .bar{margin:4px 0 0}
  h2.grp{margin:16px 2px 7px;font-size:11px}
  .sec{margin-top:9px;scroll-margin-top:110px} .sec-h{padding:9px 11px 2px;gap:4px 10px} .sec-h h3{font-size:13.5px} .sec-h .hv b{font-size:15px} .sec-h .hv{flex-wrap:wrap;gap:5px}
  .chart{padding:2px 4px 0} .legend{padding:0 11px 5px;font-size:11px;gap:10px}
  table{font-size:11.5px} th,td{padding:5px 7px} th{font-size:10px}
  .status{grid-template-columns:1fr 1fr;gap:7px} .status .card{padding:8px 10px;gap:4px} .status .t{font-size:11px}
  .nodata{padding:10px 11px}
  .foot{margin-top:16px}
}
.top.cmp .brand{display:none}
.top.cmp .top-in{padding-top:6px;padding-bottom:6px}
.lt td.tl,.lt th.tl{text-align:left;white-space:nowrap}
.lt td.tl .chip{margin-right:4px}
.rk-sub{font-size:11.5px;color:var(--muted);margin:2px 0 8px;font-weight:500}
@media(max-width:640px){
table[data-t=kira]{width:100%;table-layout:fixed}
table[data-t=kira] th,table[data-t=kira] td{padding:8px 2px;font-size:11px;white-space:nowrap}
table[data-t=kira] td:first-child{white-space:normal;overflow-wrap:break-word;font-size:11px}
table[data-t=kira] th:first-child,table[data-t=kira] td:first-child{width:26%;padding-left:8px;position:static;box-shadow:none}
table[data-t=kira] th:nth-child(2),table[data-t=kira] td:nth-child(2){width:13%;text-align:center}
table[data-t=kira] th:nth-child(n+3),table[data-t=kira] td:nth-child(n+3){width:20.3%}
table[data-t=kira] .rk{display:none}
table[data-t=kira] .chip{padding:2px 5px;font-size:11px}
}
.sgc{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:rgba(128,128,128,.18);color:var(--muted)}
.sgc[data-s=BRONZE]{background:rgba(176,100,40,.18);color:#a5581a}
.sgc[data-s=SILVER]{background:rgba(120,130,150,.22);color:#68738a}
.sgc[data-s=GOLD]{background:rgba(217,160,0,.2);color:#a37100}
.sgc[data-s="GOLD+"]{background:rgba(217,140,0,.3);color:#9a5f00}
.sgc[data-s=PLATINUM]{background:rgba(60,110,200,.18);color:#2d5fb8}
.sgc[data-s=BLACK]{background:#1b1f2a;color:#fff;border:1px solid rgba(128,128,128,.5)}
.sgarrow{color:var(--muted);margin:0 3px;font-size:12px}
.stabs{display:flex;gap:6px;padding:0 15px 12px;flex-wrap:wrap}
.stabs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.stabs button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;padding:4px 15px 12px}
.dg div span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.dg div b{font-size:14px}
.mbad{color:var(--bad);font-weight:700}.mest{font-style:italic;opacity:.85}
.lt td.tc,.lt th.tc{text-align:center}
@media(max-width:640px){.dg{grid-template-columns:repeat(2,minmax(0,1fr));padding:2px 10px 10px;gap:8px 10px}.dg div b{font-size:13px}.stabs{padding:0 10px 10px}.stabs button{padding:6px 10px;font-size:12.5px}}

.dg .chip,.dg .sgc{display:inline-block;width:auto;max-width:100%}
.lt.mini td,.lt.mini th{padding:7px 6px}
.lt.mini td:first-child,.lt.mini th:first-child{position:static}
@media(max-width:640px){
.tabs button{padding:6px 4px!important;font-size:11.5px!important}
.lt.mini{width:100%;table-layout:fixed}
.lt.mini td,.lt.mini th{padding:7px 2px;font-size:11px;text-align:center;white-space:normal;overflow-wrap:anywhere}
.lt.mini td:first-child,.lt.mini th:first-child{text-align:left;padding-left:8px;width:22%}
.lt.mini .sgc{font-size:9.5px;padding:2px 5px}
.lt.mini .chip{font-size:9px;padding:2px 3px;letter-spacing:-.2px}
.lt.mini td:last-child,.lt.mini th:last-child{width:21%}
.lt.mmat td,.lt.mmat th{font-size:10px;padding:7px 0}
.lt.mmat td:first-child,.lt.mmat th:first-child{width:15%;font-size:10px;padding-left:6px}
}
</style>
<link rel="apple-touch-icon" href="icon-sube-dashboard.png"><link rel="icon" type="image/png" href="icon-sube-dashboard.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Şube Dashboard"></head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Şube Dashboard<small id="period"></small></div>
    <button class="thm" id="thm" aria-label="Tema değiştir">◐</button>
    <div class="tabs" role="tablist">
      <button id="tabS" aria-pressed="true"><span class="lg">Şube Detayı</span><span class="sm">Şube</span></button>
      <button id="tabL" aria-pressed="false"><span class="lg">Tüm Şubeler</span><span class="sm">Liste</span></button>
      <button id="tabY" aria-pressed="false"><span class="lg">SY Karşılaştırma</span><span class="sm">SY Kıyas</span></button>
      <button id="tabG" aria-pressed="false">Segment</button>
      <button id="tabD" aria-pressed="false">Dikkat</button>
      <button id="tabT" aria-pressed="false">Trend</button>
      <button id="tabK" aria-pressed="false">Kira</button>
    </div>
    <div class="picker" id="picker">
      <button id="prev" aria-label="Önceki şube">‹</button>
      <div class="selw"><div class="selv" id="selv" aria-hidden="true"></div><select id="sel" aria-label="Şube seç"></select></div>
      <button id="next" aria-label="Sonraki şube">›</button>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>

    return items.map(function(it){
      var v=me[it[0]],vals=all.map(function(x){return x[it[0]]}).filter(isn),t='';
      if(isn(v)){var r=1+vals.filter(function(x){return x>v}).length,q=r/vals.length;t='<span class="chip '+(color?(q<=0.25?'up':q>0.75?'dn':'nu'):'nu')+'">'+r+'. / '+vals.length+'</span>'}
      else t='<span class="chip nu">–</span>';
      return '<div><span>'+it[1]+'</span>'+t+'</div>';
    }).join('');
  }
  return '<div class="card rank"><div class="rk-h">Sıralama · '+all.length+' şube içinde</div><div class="rk-sub">Büyüklükten bağımsız: geçen yıla göre büyüme (kıyas) ve hedef gerçekleşme (HGO, denetim). İlk dörtte bir yeşil, son dörtte bir kırmızı.</div><div class="rk-g">'+chips(perf,true)+'</div>'+'</div>';
}
function updSel(){var v=document.getElementById('selv');if(v&&cur)v.innerHTML='<b>'+esc(cur.name)+'</b><small>'+esc(cur.code)+'</small>'}
function setHash(){var h=view==='sube'?'#sube-'+cur.code.replace('.','-'):'#'+view;try{if(location.hash!==h)history.replaceState(null,'',h)}catch(e){try{location.hash=h}catch(e2){}}}
function selectCode(code,keep){
  var b=D.branches.filter(function(x){return x.code===code})[0]||D.branches[0];
  cur=b;document.getElementById('sel').value=b.code;updSel();
  try{localStorage.setItem('sube',b.code)}catch(e){}
  view='sube';render();setHash();if(!keep)window.scrollTo(0,0);
}
function fromHash(){
  var h=(location.hash||'').slice(1),m=/^sube-(\d+)-(\d+)$/.exec(h);
  if(h==='liste'){view='liste';render();return}
  if(h==='sy'||h==='dikkat'||h==='trend'||h==='kira'||h==='segment'){view=h;render();return}
  if(m){selectCode(m[1]+'.'+m[2],true);return}
  return false;
}
function init(){
  var sel=document.getElementById('sel');
  sel.innerHTML=D.branches.map(function(b){return '<option value="'+esc(b.code)+'">'+esc(b.name)+' — '+esc(b.code)+'</option>'}).join('');
  D.schema.forEach(function(s,i){IDX[s.key]=i;s.labels.forEach(function(l,r){if(/^FARK/.test(l))s.kinds[r]='pct'})});
  sel.addEventListener('change',function(){selectCode(sel.value)});
  function step(n){var i=D.branches.findIndex(function(b){return b===cur});selectCode(D.branches[(i+n+D.branches.length)%D.branches.length].code)}
  document.getElementById('prev').onclick=function(){step(-1)};
  document.getElementById('next').onclick=function(){step(1)};
  document.getElementById('tabS').onclick=function(){view='sube';render();setHash();window.scrollTo(0,0)};
  document.getElementById('tabL').onclick=function(){view='liste';render();setHash();window.scrollTo(0,0)};
  document.getElementById('tabG').onclick=function(){view='segment';render();setHash();window.scrollTo(0,0)};
  document.getElementById('tabD').onclick=function(){view='dikkat';render();setHash();window.scrollTo(0,0)};
  document.getElementById('tabT').onclick=function(){view='trend';render();setHash();window.scrollTo(0,0)};
  document.getElementById('tabK').onclick=function(){view='kira';render();setHash();window.scrollTo(0,0)};
  document.getElementById('tabY').onclick=function(){view='sy';render();setHash();window.scrollTo(0,0)};
  document.getElementById('nav').addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;e.preventDefault();var el=document.getElementById('sec-'+a.dataset.k);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});
  document.getElementById('app').addEventListener('click',function(e){
    if(e.target.id==='clrF'){F={sy:'',kulvar:'',il:''};render();return}
    var sb=e.target.closest('.stabs button');if(sb){window.SEGTAB=sb.dataset.st;var yy=window.scrollY;render();window.scrollTo(0,yy);return}
    var tr=e.target.closest('tr.cl');if(tr){if(tr.dataset.sy){F={sy:tr.dataset.sy,kulvar:'',il:''};view='liste';render();setHash();window.scrollTo(0,0)}else selectCode(tr.dataset.c);return}
    var th=e.target.closest('.lt th[data-k]');if(th){var id=th.closest('table').dataset.t,k=th.dataset.k,st=SS[id];if(st[0]===k)st[1]=-st[1];else{st[0]=k;st[1]=(STRK.indexOf(k)>=0)?1:-1}render()}
  });
  window.addEventListener('hashchange',function(){fromHash()});
  document.getElementById('app').addEventListener('change',function(e){var t=e.target;if(t.classList.contains('fsel')){F[t.dataset.f]=t.value;var y=window.scrollY;render();window.scrollTo(0,y)}else if(t.id==='dkTh'){dkTh=parseFloat(t.value);var y2=window.scrollY;render();window.scrollTo(0,y2)}});
  (function(){var r=document.documentElement,b=document.getElementById('thm');function cur(){var t=r.getAttribute('data-theme');return t||(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
    try{var sv=localStorage.getItem('tema');if(sv)r.setAttribute('data-theme',sv)}catch(e){}
    function ic(){b.textContent=cur()==='dark'?'☀':'☾'}ic();
    b.onclick=function(){var n=cur()==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('tema',n)}catch(e){}ic()}})();
  (function(){var tp=document.querySelector('.top'),c=false;window.addEventListener('scroll',function(){var y=window.scrollY;if(!c&&y>160){c=true;tp.classList.add('cmp')}else if(c&&y<40){c=false;tp.classList.remove('cmp')}},{passive:true})})();
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){var y=window.scrollY;if(view==='sube'){renderBranch();window.scrollTo(0,y)}},250)});
  var saved=null;try{saved=localStorage.getItem('sube')}catch(e){}
  cur=D.branches.filter(function(b){return b.code===saved})[0]||D.branches.filter(function(b){return b.code==='00985.00083'})[0]||D.branches[0];
  sel.value=cur.code;updSel();
  if(fromHash()===false){render();setHash()}
}
try{D=JSON.parse(document.getElementById('dj').textContent);init()}catch(e){document.getElementById('app').innerHTML='<div id="err">Veri okunamadı ('+esc(e.message)+').</div>'}
})();
</script>
</body>
</html>
