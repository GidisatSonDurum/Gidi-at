<script type="application/json" id="app">"\u003c!DOCTYPE html>\n\u003chtml lang=\"tr\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light dark\">\n\u003ctitle>Sabit Destek \u00d6zeti\u003c/title>\n\u003cstyle>\n:root{\n  /* Plan: koyu lacivert ba\u015fl\u0131k band\u0131, \u00fcst\u00fcne binen beyaz kartlar. Renk veride konu\u015fur: ye\u015fil art\u0131\u015f, k\u0131rm\u0131z\u0131 azal\u0131\u015f,\n     sar\u0131 s\u0131f\u0131r civar\u0131. Segmentler kendi renginde rozet (BLACK siyah, GOLD alt\u0131n...). Yaz\u0131 tipi: sistem sans.\n     Yerle\u015fim: solda yap\u0131\u015fkan \u00f6zet (b\u00fcy\u00fck h\u0131z g\u00f6stergesi + GK kartlar\u0131), sa\u011fda \u015fube listesi; telefonda tek s\u00fctun. */\n  color-scheme: light;\n  --bg:#eef1f6; --surface:#ffffff; --ink:#0f1b2d; --ink2:#51607a;\n  --line:#e3e8f0; --hair:rgba(15,27,45,.08); --tile:#f3f5f9; --ring:#0f1b2d;\n  --band1:#0b1a2e; --band2:#1b3a63;\n  --needle:#0f1b2d; --tick:#8a96ab; --tick-maj:#51607a;\n  --up:#1fb36b; --up-ink:#0b7d45; --up-soft:#e1f6ea;\n  --down:#d62839; --down-ink:#c0182d; --down-soft:#fde6e9;\n  --zero:#8a96ab; --zero-ink:#51607a; --zero-soft:#eceff4;\n  --shadow:0 1px 2px rgba(15,27,45,.06),0 10px 28px rgba(15,27,45,.07);\n  --font:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    color-scheme: dark;\n    --bg:#070e1a; --surface:#0f1a2c; --ink:#e9eef7; --ink2:#9fb0c9;\n    --line:#1c2a42; --hair:rgba(255,255,255,.09); --tile:#16233a; --ring:#e9eef7;\n    --band1:#050b15; --band2:#0f2a4a;\n    --needle:#e9eef7; --tick:#6f819d; --tick-maj:#9fb0c9;\n    --up:#3ddc84; --up-ink:#5ee59a; --up-soft:rgba(61,220,132,.14);\n    --down:#ff5a5f; --down-ink:#ff8a8e; --down-soft:rgba(255,90,95,.15);\n    --zero:#6f819d; --zero-ink:#9fb0c9; --zero-soft:rgba(159,176,201,.12);\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);\n  }\n}\n:root[data-theme=\"dark\"]{\n  color-scheme: dark;\n  --bg:#070e1a; --surface:#0f1a2c; --ink:#e9eef7; --ink2:#9fb0c9;\n  --line:#1c2a42; --hair:rgba(255,255,255,.09); --tile:#16233a; --ring:#e9eef7;\n  --band1:#050b15; --band2:#0f2a4a;\n  --needle:#e9eef7; --tick:#6f819d; --tick-maj:#9fb0c9;\n  --up:#3ddc84; --up-ink:#5ee59a; --up-soft:rgba(61,220,132,.14);\n  --down:#ff5a5f; --down-ink:#ff8a8e; --down-soft:rgba(255,90,95,.15);\n  --zero:#6f819d; --zero-ink:#9fb0c9; --zero-soft:rgba(159,176,201,.12);\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);\n}\n\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%;text-size-adjust:100%}\nbody{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}\nbutton,input,select{font:inherit;color:inherit}\nh1,h2,h3,p,dl,dd,dt{margin:0}\nbutton{cursor:pointer}\n[hidden]{display:none!important}\n:focus-visible{outline:2px solid var(--ring);outline-offset:2px}\n.band :focus-visible{outline-color:#fff}\n.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}\n\n/* y\u00f6n renkleri: ye\u015fil art\u0131\u015f, k\u0131rm\u0131z\u0131 azal\u0131\u015f, gri de\u011fi\u015fmedi */\n.up{--dir:var(--up);--dir-ink:var(--up-ink);--dir-soft:var(--up-soft)}\n.down{--dir:var(--down);--dir-ink:var(--down-ink);--dir-soft:var(--down-soft)}\n.flat{--dir:var(--zero);--dir-ink:var(--zero-ink);--dir-soft:var(--zero-soft)}\n.gl{font-size:.8em;line-height:1}\n.gl.up{color:var(--up)} .gl.down{color:var(--down)} .gl.flat{color:var(--zero);font-weight:800}\n\n/* koyu ba\u015fl\u0131k band\u0131 */\n.band{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--band1) 0%,var(--band2) 100%);color:#fff;padding:22px 16px 70px}\n.band-in{position:relative;max-width:1360px;margin:0 auto}\n.band-deco{position:absolute;right:-24px;top:-44px;width:340px;height:auto;opacity:.13;pointer-events:none}\n.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px}\nh1{font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.02em}\n.sub{margin-top:5px;font-size:13.5px;color:rgba(255,255,255,.8)}\n.stamp{font-size:12.5px;color:rgba(255,255,255,.66)}\n.brand{display:flex;align-items:center;gap:13px;min-width:0}\n.logo{display:block;width:56px;height:56px;flex:0 0 auto;border-radius:15px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.24),0 4px 14px rgba(0,0,0,.4)}\n.ctl{display:flex;gap:2px;padding:3px;background:rgba(255,255,255,.15);border-radius:13px;max-width:460px;margin-top:18px}\n.ctl button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:700;font-size:14px;color:rgba(255,255,255,.85)}\n.ctl button[aria-pressed=\"true\"]{background:#fff;color:#0f1b2d;box-shadow:0 1px 3px rgba(0,0,0,.3)}\n\n.app{position:relative;max-width:1360px;margin:-48px auto 0;padding:0 16px 56px}\n.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}\n.side{display:flex;flex-direction:column;gap:16px;min-width:0}\n.main{min-width:0}\n@media (min-width:1000px){\n  .layout{grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}\n  .side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding:2px 2px 8px}\n  .main{margin-top:66px}   /* \u00fcst band\u0131n alt\u0131ndan ba\u015flas\u0131n; \u00f6zet kart\u0131 banda ta\u015far */\n}\n.card{background:var(--surface);border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow)}\n\n/* \u00f6zet kart\u0131 */\n.hero{padding:16px}\n.hero-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}\n.hero-head h2{font-size:16px;font-weight:800;line-height:1.25}\n.hero-n{font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}\n.hero-meas{font-size:12.5px;color:var(--ink2);margin-top:2px}\n.dial{display:block;width:100%;max-width:360px;height:auto;margin:6px auto 0}\n.hv{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:0}\n.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:999px;background:var(--dir-soft);color:var(--dir-ink);font-size:13px;font-weight:800}\n.cap{font-size:12.5px;color:var(--ink2);text-align:center}\n.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}\n.tile{background:var(--tile);border-radius:12px;padding:10px 12px;min-width:0}\n.tile .tl{display:block;font-size:12px;font-weight:600;color:var(--ink2)}\n.tile b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}\n.tile.wide{grid-column:1/-1;background:var(--dir-soft)}\n.tile.wide b{color:var(--dir-ink);font-size:20px}\n.cnt{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}\n.cnt>span{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px}\n.cnt b{font-weight:800}\n.c-up{background:var(--up-soft);color:var(--up-ink)}\n.c-down{background:var(--down-soft);color:var(--down-ink)}\n.c-flat{background:var(--zero-soft);color:var(--zero-ink)}\n\n/* g\u00f6sterge \u00e7izimleri */\n.tk{stroke:var(--tick);stroke-width:1;stroke-linecap:round}\n.tk.maj{stroke:var(--tick-maj);stroke-width:1.6}\n.lb{font:700 11px var(--font);fill:var(--ink2)}\n.lg{font:800 11px var(--font)}\n.lg.d{fill:var(--down-ink)} .lg.u{fill:var(--up-ink)}\n.ndl{fill:var(--needle)}\n.hub{fill:var(--needle)}\n.hub2{fill:var(--surface)}\n.dn{font:800 48px var(--font);letter-spacing:-.03em;fill:var(--dir-ink)}\n.mn{font:800 22px var(--font);letter-spacing:-.02em;fill:var(--dir-ink)}\n.mg{display:block;width:100%;height:auto}\n\n/* GK kartlar\u0131 */\n.lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 2px 8px}\n.gkh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}\n.gkh .hint{font-size:12px;color:var(--ink2);margin-bottom:8px}\n.gk{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 12px;scroll-snap-type:x proximity;scroll-padding:0 16px}\n.gk button{flex:0 0 112px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 8px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;text-align:center;box-shadow:var(--shadow)}\n.gk button[aria-pressed=\"true\"]{background:var(--band2);border-color:transparent;color:#fff;--needle:#fff;--surface:var(--band2);--ink2:rgba(255,255,255,.78);--up-ink:#5ee59a;--down-ink:#ff8a8e;--zero-ink:rgba(255,255,255,.85)}\n.gk button:disabled{opacity:.45;cursor:default}\n.gk .gn{font-size:12.5px;font-weight:800;line-height:1.2;min-height:30px;display:flex;align-items:center;justify-content:center;text-wrap:balance}\n.gk .gc{font-size:11.5px;font-weight:600;color:var(--ink2)}\n.gk .mg{width:92px}\n@media (min-width:1000px){\n  .gk{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:0;padding:2px 2px 8px}\n  .gk button{flex:none}\n}\n\n/* segment rozetleri: ad\u0131 rengi olan segmentler kendi renginde */\n.sg{display:inline-flex;align-items:center;justify-content:center;padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:800;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent;line-height:1.35}\n.sg-BLACK{background:#111827;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}\n.sg-PLATINUM{background:linear-gradient(135deg,#f1f4f8,#c5d0de);color:#1e293b;border-color:#aebace}\n.sg-GOLDP{background:linear-gradient(135deg,#ffe58f,#f0a500);color:#3b2a00;border-color:#e09b00}\n.sg-GOLD{background:linear-gradient(135deg,#fdeeb4,#e8c254);color:#4a3500;border-color:#dcb440}\n.sg-SILVER{background:linear-gradient(135deg,#f5f6f8,#cdd3dc);color:#374151;border-color:#b5bcc8}\n.sg-BRONZE{background:linear-gradient(135deg,#b0632a,#8a4313);color:#fff;border-color:#7a3a10}\n.sg-none{background:transparent;border:1px dashed var(--ink2);color:var(--ink2);font-weight:700}\n.sg.chg{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ring)}\n.arw{font-size:13px;color:var(--ink2)}\n\n/* s\u00fczge\u00e7ler ve ara\u00e7 \u00e7ubu\u011fu */\n.chips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;margin:0 -16px;padding:5px 16px 9px;scroll-padding:0 16px;scrollbar-width:none}\n.chips::-webkit-scrollbar{display:none}\n.chip{flex:0 0 auto;border:0;border-radius:10px;padding:8px 13px;font-size:13px;font-weight:800;letter-spacing:.02em;opacity:.92;white-space:nowrap}\n@media (min-width:1000px){\n  .chips{flex-wrap:wrap;overflow:visible;margin:0;padding:5px 3px 9px}\n}\n.chip.neutral{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair),var(--shadow);letter-spacing:0}\n.chip .n{font-weight:600;opacity:.85;margin-left:6px;font-variant-numeric:tabular-nums}\n.chip[aria-pressed=\"true\"]{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ring)}\n.chip.neutral[aria-pressed=\"true\"]{background:var(--ink);color:var(--surface)}\n.chip:disabled{opacity:.35;cursor:default}\n.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 6px}\n.search{flex:1 1 200px;min-width:0}\n.search input,.sortsel{width:100%;padding:10px 14px;border:1px solid var(--hair);border-radius:12px;background:var(--surface);min-height:44px;box-shadow:var(--shadow)}\n.sortsel{width:auto;flex:1 1 200px;min-width:0}\n.viewctl{display:flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--hair);border-radius:12px;flex:0 0 auto;box-shadow:var(--shadow)}\n.viewctl button{border:0;background:transparent;border-radius:9px;padding:9px 14px;font-weight:700;font-size:13.5px;color:var(--ink2)}\n.viewctl button[aria-pressed=\"true\"]{background:var(--ink);color:var(--surface)}\n.rh{display:flex;align-items:baseline;gap:10px;margin:14px 2px 10px}\n.rh h2{font-size:17px;font-weight:800}\n.rc{font-size:13px;color:var(--ink2)}\n.lnk{margi  const e=[];const num=x=>typeof x==='number'&&isFinite(x);
 if(D.subeler.some(s=>!s.ad||!s.kod))e.push('Şube adı/kodu eksik satır var (satır 4–57)');
 const full=D.subeler.filter(s=>s.v.every(num)).length;
 if(full<40)e.push('Tam veri satırı sayısı beklenenden az: '+full+'/54');
 D.ort.forEach(o=>{if(!o.v.slice(0,12).some(num))e.push(o.ad+' satırı boş')});
 if(!D.sy.every(s=>s.ad))e.push('SY satırları (66–71) okunamadı');
 return e;
}

/* Sabit Destek: SEGMENTLER sayfası -> {meta,rows} */
const SD_SEG=['BLACK','PLATINUM','GOLD+','GOLD','SILVER','BRONZE'];
const tU=s=>String(s==null?'':s).trim().toLocaleUpperCase('tr');
function validData(D){return !!(D&&D.meta&&Array.isArray(D.rows)&&D.rows.length>0&&typeof D.meta.built==='string')}
function titleOf(D){const p=D.meta.built.split('-'),M=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];return 'Sabit Destek · '+(+p[2])+' '+M[+p[1]-1]}
function injectData(app,D){const a=app.indexOf('var DATA = ')+11,b=app.indexOf(';\n',a);return app.slice(0,a)+JSON.stringify(D).replace(/</g,'\\u003c')+app.slice(b)}
async function parseExcel(wb,fname,cur){
 const sh=wb.sheets.find(s=>tU(s.name)==='SEGMENTLER');
 if(!sh)throw new Error('"SEGMENTLER" sayfası bulunamadı. Dosyadaki sayfalar: '+wb.sheets.map(s=>s.name).join(', '));
 const cell=await wb.sheet(sh.name),er=[],warns=[],rows=[];
 if(tU(cell(2,2))!=='KOD'||tU(cell(2,3))!=='ŞUBE'||tU(cell(2,4))!=='GK')er.push('Başlık satırı (2. satır) beklenen düzende değil: KOD / ŞUBE / GK');
 if(String(cell(2,5)||'').trim()!=="Q3'26"||String(cell(2,6)||'').trim()!=="Q4'26")er.push("Dönem başlıkları Q3'26 / Q4'26 değil. Uygulamadaki başlıklar bu döneme göre yazıldı; yeni dönem için güncelleme gerekir.");
 const num=x=>typeof x==='number'&&isFinite(x);
 const seen={};
 for(let r=3;r<=400;r++){
  const kod=cell(r,2);if(kod==null||String(kod).trim()==='')break;
  const seg=c=>{const v=cell(r,c);const s=v==null?'':String(v).trim();return s===''?null:s};
  const o={kod:String(kod).trim(),sube:String(cell(r,3)||'').trim(),gk:String(cell(r,4)||'').trim(),s3:seg(5),s4:seg(6),
   sd3:cell(r,8),sd4:cell(r,9),on3:cell(r,11),on4:cell(r,12),t3:cell(r,14),t4:cell(r,15)};
  if(!o.sube||!o.gk)er.push('Satır '+r+': şube adı ya da GK boş');
  ['sd3','sd4','on3','on4','t3','t4'].forEach(k=>{if(!num(o[k]))er.push('Satır '+r+' ('+o.sube+'): '+k.toUpperCase()+' sayı değil')});
  [o.s3,o.s4].forEach(s=>{if(s&&SD_SEG.indexOf(s)<0)er.push('Satır '+r+' ('+o.sube+'): bilinmeyen segment "'+s+'"')});
  if(seen[o.kod])er.push('Satır '+r+': kod tekrar ediyor ('+o.kod+')');seen[o.kod]=1;
  rows.push(o);
 }
 if(rows.length<40)er.push('Şube sayısı beklenenden az: '+rows.length);
 if(er.length>12){const n=er.length;er.length=12;er.push('… ve '+(n-12)+' hata daha')}
 const d=new Date(),p2=n=>String(n).padStart(2,'0');
 const data={meta:{file:fname,sheet:sh.name,built:d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),hdrQ3Total:String(cell(2,14)||'').trim()},rows};
 const fm=n=>Math.round(n).toLocaleString('tr-TR');
 const t3=rows.reduce((a,r)=>a+(num(r.t3)?r.t3:0),0),t4=rows.reduce((a,r)=>a+(num(r.t4)?r.t4:0),0);
 if(cur&&cur.rows&&cur.rows.length!==rows.length)warns.push('Şube sayısı değişti: yayındaki '+cur.rows.length+', yeni '+rows.length);
 return {data,errors:er,warns,summary:'<b>'+esc(fname)+'</b><br>'+rows.length+' şube · Toplam Q3\'26: '+fm(t3)+' ₺ · Q4\'26: '+fm(t4)+' ₺<br>Bu iki toplamı Excel\'deki toplam sütunlarıyla karşılaştırabilirsiniz.'};
}
