/* ----- ayar denetimi: hiçbir şey yazmadan, sohbet düğümünü sorgula ----- */
function bmIdxErr(st, j){ return st === 401 || st === 403 || (st === 400 && /index/i.test(j && j.error ? String(j.error) : '')); }
function bmProbe(force){
  var it = bmConn()[0];
  if (!it || BM.probing) return;
  if (!force && Date.now() - BM.probeAt < 300000) return;
  BM.probing = true; BM.probeAt = Date.now();
  xhr('GET', bgUrl(it, '/c.json?orderBy=%22t%22&limitToLast=1'), null, function(st, j){
    var need;
    if (st === 200) need = false;
    else if (bmIdxErr(st, j)) need = true;
    else { BM.probing = false; BM.probeAt = 0; if (force) bmNote('Şimdi kontrol edilemedi. İnternetini kontrol edip tekrar dene.', false); return; }
    BM.rules = need;
    if (need){
      BM.probing = false; BM.rulesNew = false; bmRenderRules(); bcRulesChanged();
      if (force) bmNote('Kural henüz yayında görünmüyor. Yayınladıktan sonra birkaç saniye bekleyip tekrar dene.', false);
      return;
    }
    xhr('GET', bgUrl(it, '/yl/sy.json?orderBy=%22t%22&limitToLast=1'), null, function(st2, j2){                /* sohbet kuralı tamam; en yeni eklemelerin (yayınlar) kuralı da var mı? Hepsi tek yapıştırmada gelir */
      var nw;
      BM.probing = false;
      if (st2 === 200) nw = false;
      else if (bmIdxErr(st2, j2)) nw = true;
      else { bmRenderRules(); bcRulesChanged(); return; }                       /* belirsiz: önceki durum kalır */
      BM.rulesNew = nw; bmRenderRules(); bcRulesChanged();
      if (force) bmNote(nw ? 'Sohbet çalışıyor; yeni özellikler için kural henüz yayında görünmüyor. Yayınladıktan sonra birkaç saniye bekleyip tekrar dene.' : 'Tamam, kural yayında. Yeni özellikler açıldı.', !nw);
    });
  });
}

/* ----- gönderim ----- */
/* Bildirim: şubenin "aşağı" ntfy konusuna kısa bir yazı. Mesaj metni YOLLANMAZ. Etiket (gk-bm-<gönderim kimliği>) aynı gönderimin bildirimlerini
   bir telefonda tek bildirimde birleştirir; sw.js bunu tanır. */
var BM_PUSH = 'Şube sohbetinde yeni mesaj var.';
function bmNtfy(topic, title, id, cb){
  var x, done = false;
  function fin(ok){ if (!done){ done = true; cb(ok); } }
  if (!topic){ fin(false); return; }
  try {
    x = new XMLHttpRequest();
    x.open('POST', NTFY + '/' + topic + '?title=' + encodeURIComponent(title) + '&tags=' + encodeURIComponent('gk-bm-' + id), true);
    x.timeout = 15000; x.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
    x.onreadystatechange = function(){ if (x.readyState === 4) fin(x.status >= 200 && x.status < 300); };
    x.ontimeout = function(){ fin(false); }; x.onerror = function(){ fin(false); };
    x.send(BM_PUSH);
  } catch(e){ fin(false); }
}
function bmPush(res, row, it){
  row.ps = 'wait';
  bmNtfy(tpDown(it.k), res.n, res.id, function(ok){ row.ps = ok ? 'ok' : 'fail'; bmDone(res); });
}
function bmPut(res, row){
  var it = bmFind(row.s);
  if (!it || !it.k){ if (row.put) row.st = 'fail'; else row.ps = 'fail'; row.code = 0; bmDone(res); return; }
  if (!row.put){ bmPush(res, row, it); return; }                               /* yalnız bildirim tekrarı: mesaj zaten şubede */
  row.st = 'wait'; row.code = 0;
  xhr('PUT', bgUrl(it, '/c/' + res.id + '.json?print=silent'), bmBody(res.n, res.m), function(st){
    row.code = st;
    row.st = st >= 200 && st < 300 ? 'ok' : (st === 400 || st === 401 || st === 403 ? 'rules' : 'fail');
    if (row.st === 'ok' && res.push) bmPush(res, row, it);                     /* bildirim, mesaj şubeye ulaştıktan SONRA gider */
    else bmDone(res);
  });
}
function bmEntry(id){ var i; for (i = 0; i < BM.hist.length; i++) if (BM.hist[i].id === id) return BM.hist[i]; return null; }
function bmDone(res){
  var e = bmEntry(res.id), wait = 0, rules = 0, pbad = 0, i, r;
  for (i = 0; i < res.rows.length; i++){
    r = res.rows[i];
    if (r.st === 'wait' || r.ps === 'wait') wait++;
    if (r.st === 'rules') rules++;
    if (r.ps === 'fail') pbad++;
    if (r.st === 'ok' && e && e.ok.indexOf(r.s) < 0) e.ok.push(r.s);
    if (r.ps === 'ok' && e && e.pk && e.pk.indexOf(r.s) < 0) e.pk.push(r.s);
  }
  if (wait){ bmRenderHist(); return; }
  BM.busy = false;
  if (rules){ BM.rules = true; bmRenderRules(); bmNote('Mesaj gitmedi: Firebase kuralı güncellenmemiş.', false); }
  else if (e && e.ok.length < e.all.length) bmNote('Bazı şubelere gitmedi. Aşağıdan tekrar deneyebilirsin.', false);
  else if (pbad) bmNote('Mesaj şubelere ulaştı ama bazı şubelere bildirim gönderilemedi. Aşağıdan bildirimi tekrar gönderebilirsin.', false);
  else { bmNote('', true); }
  bmSave(); bmRenderHist(); bmUpdate();
}
function bmRun(res){
  var i;
  BM.res = res; BM.busy = true;
  bmRenderHist(); bmUpdate();
  for (i = 0; i < res.rows.length; i++) bmPut(res, res.rows[i]);
}
function bmGo(){
  var ta = $('#bmIn'), txt = ta ? bmClean(ta.value) : '', sel = bmSel(), res, e, i;
  if (BM.busy || !txt || !sel.length) return;
  BM.confirm = false; bmNote('', true);
  res = { id:chId(), t:Date.now(), n:BM.name, m:txt.slice(0, BM_MAX), push:true, rows:[] };
  e = { id:res.id, t:res.t, n:res.n, m:res.m, all:[], ok:[], pk:[], v:2 };
  for (i = 0; i < sel.length; i++){ res.rows.push({ s:sel[i].s, st:'wait', code:0, put:true, ps:'' }); e.all.push(sel[i].s); }
  BM.hist.unshift(e); if (BM.hist.length > BM_HIST) BM.hist.length = BM_HIST;
  ta.value = ''; bmGrow();
  bmSave();
  bmRun(res);
}
function bmRetry(id){
  var e = bmEntry(id), res, i;
  if (!e || BM.busy) return;
  res = { id:e.id, t:e.t, n:e.n, m:e.m, push:e.v === 2, rows:[] };
  for (i = 0; i < e.all.length; i++){
    if (e.ok.indexOf(e.all[i]) < 0) res.rows.push({ s:e.all[i], st:'wait', code:0, put:true, ps:'' });
    else if (res.push && e.pk.indexOf(e.all[i]) < 0) res.rows.push({ s:e.all[i], st:'ok', code:0, put:false, ps:'' });   /* mesaj gitmiş, yalnız bildirim eksik */
  }
  if (!res.rows.length) return;
  bmNote('', true);
  bmRun(res);
}

  else if (act === 'rcopy') copyText(String(RULES), function(ok){ bmNote(ok ? 'Kural kopyalandı. Şimdi Firebase\'i aç.' : 'Kopyalanamadı.', ok); });

/* ================= app17: Bölge ▸ Mesaj ▸ Yazışmalar (her şubeyle karşılıklı sohbet) =================
   Şubenin ortak sohbeti (g/<kod>/c) ile AYNI düğüm: müdürün yazdığını şubedeki herkes «Şube sohbeti»nde görür, çalışanların cevapları buraya düşer.
   Liste: her şube bir satır (son mesaj, saat, okunmamış sayısı). Satıra dokununca o şubeyle konuşma ekranı açılır; işin bitince geri çıkılır.
   Okuma: ayrı canlı bağlantı AÇILMAZ; konuşma açıkken 3 sn'de bir, liste açıkken 15 sn'de bir, diğer ekranlarda 45 sn'de bir
   yalnızca "son mesajdan sonrakiler" sorulur (birkaç yüz bayt). Okunmamış sayısı bu telefonda tutulur (gk_bcr).
   Yazma: müdürün mesajı şube sohbetine yazılır (aynı kimlik tekrar denense de çift mesaj olmaz); ardından şubenin "aşağı" bildirim konusuna
   mesajın metni OLMAYAN kısa bildirim gider (tpDown). O konuyu yalnızca şube cihazları dinler, müdürün telefonu dinlemez.
   Gitmeyen mesaj telefonda saklanır (gk_bcp), bağlanınca gider. */
var BC = { th:{}, rd:{}, cur:'', sub:'chat', tm:0, loaded:false, from:null, lastPush:{}, sig:'', env:{} };

function bcLoad(){

function bcSavePend(){

function bcLoadPend(){

  if (!o || typeof o !== 'object' || o instanceof Array) return;
  for (s in o) if (o.hasOwnProperty(s) && bmSlugOk(s) && o[s] && typeof o[s] === 'object' && !(o[s] instanceof Array))
    for (id in o[s]) if (o[s].hasOwnProperty(id)){
      v = chOk(id, o[s][id]);
      if (v) bcTh(s).pend[id] = { t:v.t, n:v.n, m:v.m, r:v.r, x:v.x, busy:false, sent:false, fail:true };
    }
}

/* ----- okuma ----- */
function bcMerge(th, val){
  var id, o, fresh = [], n = 0, gone = false;
  if (val && typeof val === 'object') for (id in val) if (val.hasOwnProperty(id)){
    o = chOk(id, val[id]); if (!o) continue;
    n++;
    if (!th.map[id]) fresh.push(o);
    th.map[id] = o;
    if (o.t > th.lastT) th.lastT = o.t;
    if (th.pend[id]){ delete th.pend[id]; gone = true; }                       /* sunucuya ulaştı: bekleyenlerden çıkar */
  }
  if (gone) bcSavePend();
  return { n:n, fresh:fresh };
}
function bcInitRead(slug, th){                                                /* ilk açılış: müdürün en son yazdığından sonraki cevaplar "yeni" sayılır; hiç yazmadıysa eskiler okunmuş */
  var id, own = 0;
  if (BC.rd[slug] != null) return;
  for (id in th.map) if (th.map.hasOwnProperty(id) && th.map[id].n === BM.name && th.map[id].t > own) own = th.map[id].t;
  BC.rd[slug] = own || th.lastT;
  bcSaveRead();
}
function bcPoll(slug){
  var it = bmFind(slug), th, gen, extra;
  if (!it || !it.k || !DEFAULT_DB) return;
  th = bcTh(slug);
  if (th.k !== it.k){ if (th.k) bcWipe(slug, th); th.k = it.k; }
  if (th.busy) return;
  th.busy = true; th.at = Date.now(); gen = th.gen;
  extra = th.ready && th.lastT ? '&startAt=' + th.lastT : '&limitToLast=' + BC_FIRST;
  xhr('GET', bgUrl(it, '/c.json?orderBy=%22t%22' + extra), null, function(st, j){
    var first, r;
    if (gen !== th.gen) return;
    th.busy = false; first = !th.ready;
    if (st === 200){
      th.err = ''; th.bad = 0;
      r = bcMerge(th, j);
      if (first){ th.ready = true; th.more = r.n >= BC_FIRST; bcInitRead(slug, th); }
    } else if ((st === 400 && /index/i.test(j && j.error ? String(j.error) : '')) || st === 401 || st === 403){
      th.err = 'rules'; BM.rules = true;
    } else th.bad++;
    bcAfter(slug);
    if (BC.cur === slug) cxTick(bcEnv(slug));
  });
}
function bcAfter(slug){
  if (BC.cur === slug){ bcRenderThread(false); bcMark(slug); bcThState(); }
  bcRenderList(); bcBadge();
  if (BM.rules) bmRenderRules();
}
function bcTick(){
  var now = Date.now(), c, i, th, iv;
  clearTimeout(BC.tm); BC.tm = 0;
  if (document.hidden) return;
  c = bmConn();
  for (i = 0; i < c.length; i++){
    th = bcTh(c[i].s);
    iv = BC.cur === c[i].s ? BC_FAST : (BG.tab === 'msg' && BC.sub === 'chat' ? BC_LIST : BC_BG);
    if (th.err === 'rules') iv = 60000;
    else if (th.bad > 2 && iv < 15000) iv = 15000;
    if (!th.busy && now - th.at >= iv) bcPoll(c[i].s);
  }
  BC.tm = setTimeout(bcTick, 1000);
}

/* ----- okunmamış ----- */
function bcUnread(slug){
  var th = BC.th[slug], rt = BC.rd[slug], id, n = 0;
  if (!th || rt == null) return 0;
  for (id in th.map) if (th.map.hasOwnProperty(id) && th.map[id].t > rt && th.map[id].n !== BM.name && cxUnreadOk(th.map[id])) n++;
  return n;
}
function bcUnreadAll(){ var n = 0; bmConn().forEach(function(x){ n += bcUnread(x.s); }); return n; }
function bcMark(slug){
  var th = BC.th[slug];
  if (th && th.ready && (BC.rd[slug] == null || BC.rd[slug] < th.lastT)){ BC.rd[slug] = th.lastT; bcSaveRead(); }
  bcBadge();
  if (th && BC.cur === slug) cxRdMark(bcEnv(slug));                            /* gördüğüm son mesajı ortak kayda yaz (okundu bilgisi) */
}
function bcBadge(){
  var n = bcUnreadAll(), t = $('#bcTab'), s = $('#bcSw'), tab = $('#tabBM'), txt = n > 99 ? '99+' : String(n);
  if (t){ t.hidden = !n; t.textContent = n ? txt : ''; }
  if (s){ s.hidden = !n; s.textContent = n ? txt : ''; }
  if (tab) tab.setAttribute('aria-label', 'Mesaj' + (n ? ', ' + n + ' okunmamış' : ''));
}

/* ----- yazma ----- */
function bcPushDown(slug, it, id, who){                                      /* mesajın metni YOK; 20 sn içinde art arda yazılanlar tek bildirim */
  if (Date.now() - (BC.lastPush[slug] || 0) < 20000) return;
  BC.lastPush[slug] = Date.now();
  bmNtfy(tpDown(it.k), who, id, function(){});
}
function bcPut(slug, id){
  var it = bmFind(slug), th = bcTh(slug), p = th.pend[id], gen = th.gen;
  if (!p || !it || !it.k || p.busy || p.sent) return;
  p.busy = true;
  cxSendRec(bcEnv(slug), id, p, function(st){                                  /* ek varsa önce ek, sonra mesaj kaydı */
    var q = th.pend[id], ta;
    if (gen !== th.gen || !q) return;
    q.busy = false;
    if (st >= 200 && st < 300){
      q.fail = false; q.sent = true; th.err = ''; bcSavePend(); cxAfterSend(bcEnv(slug), id, q);
      if (!q.r) bcPushDown(slug, it, id, q.n);                                  /* düzeltme / geri alma bildirim göndermez */
      setTimeout(function(){ bcPoll(slug); }, 350);                            /* kendi mesajını sunucu saatiyle hemen geri al */
    } else if (st === 400 || st === 401 || st === 403){                        /* kural güncellenmemiş: mesaj saklanmaz, yazı geri gelir */
      delete th.pend[id]; bcSavePend(); th.err = 'rules'; BM.rules = true; bmRenderRules();
      ta = $('#bcIn'); if (ta && !ta.value && BC.cur === slug && !q.r && !q.a){ ta.value = q.m; bcGrow(); }
    } else {
      q.fail = true; bcSavePend();
      clearTimeout(th.rt); th.rt = setTimeout(function(){ bcFlush(slug); }, 6000);
    }
    if (BC.cur === slug){ bcRenderThread(false); bcThState(); }
    bcRenderList();
  });
}
function bcFlush(slug){ var th = bcTh(slug), id; for (id in th.pend) if (th.pend.hasOwnProperty(id)) bcPut(slug, id); }
function bcFlushAll(){ var s; for (s in BC.th) if (BC.th.hasOwnProperty(s)) bcFlush(s); }
function bcSend(){
  var ta = $('#bcIn'), slug = BC.cur, it = slug ? bmFind(slug) : null, th, r;
  if (!ta || !it || !it.k) return;
  th = bcTh(slug);
  r = cxPrep(bcEnv(slug), ta);                                                  /* metin, ek ya da düzeltme */
  if (!r) return;
  r.o.busy = false; r.o.sent = false; r.o.fail = false; th.pend[r.id] = r.o;
  bcSavePend();
  ta.value = ''; bcGrow(); bcRenderThread(true);
  bcPut(slug, r.id);
  try { ta.focus(); } catch(e){}
}

/* ----- liste ----- */
function bcWhen(t){
  var d = new Date(t), n = new Date(), y = new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1);
  function same(a, b){ return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  if (same(d, n)) return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  if (same(d, y)) return 'Dün';
  return d.getDate() + ' ' + CH_AY[d.getMonth()].slice(0, 3);
}
function bcLast(slug){
  var th = BC.th[slug];
  if (!th) return null;
  return cxLastView(bcAllMsgs(th));                                            /* düzeltilmiş metin / ek yazısı / "geri aldı" */
}
function bcRows(){
  var rows = bmConn().map(function(it, i){ return { it:it, i:i, th:BC.th[it.s] || null, last:bcLast(it.s), un:bcUnread(it.s) }; });
  rows.sort(function(a, b){ return (b.last ? b.last.t : 0) - (a.last ? a.last.t : 0) || a.i - b.i; });
  return rows;
}
function bcSnip(r){
  var th = r.th, l = r.last, one;
  if (!l){
    if (th && th.ready) return 'Henüz mesaj yok';
    return th && (th.err || th.bad > 2) ? 'Okunamadı' : 'Yükleniyor…';
  }
  if (l.tomb) return (l.n === BM.name ? 'Sen' : l.n) + ' bir mesajı geri aldı';
  one = String(l.m).replace(/\s+/g, ' ');
  return (l.n === BM.name ? 'Sen: ' : l.n + ': ') + one;
}
function bcRenderList(){
  var box = $('#bcBox'), rows, h = '', sg, bad = false;
  if (!box || BC.sub !== 'chat') return;

  rows.forEach(function(r){ if (r.th && r.th.err === 'rules') bad = true; });
  sg = rows.map(function(r){
    return r.it.s + ':' + (r.last ? r.last.id + r.last.t : '') + ':' + (r.th ? r.th.lastT : 0) + ':' + r.un + ':' + (r.th ? (r.th.ready ? 1 : 0) + r.th.err + (r.th.bad > 2 ? 'b' : '') : '-');
  }).join('|') + '|' + BM.name + '|' + (bad ? 1 : 0) + (BM.rulesNew ? 'n' : '');

    else if (BM.rulesNew) h += '<div class="bmw" role="status"><b>Yeni özellikler için bir kez ayar gerekiyor</b><p>Fotoğraf, dosya, okundu bilgisi ve profil fotoğrafı kapalı. «Toplu mesaj» sekmesinde adım adım yönerge var. O zamana kadar sohbet eskisi gibi çalışır.</p><button class="shb" type="button" data-bm="sub" data-v="all">Yönergeyi göster</button></div>';
    h += '<div class="bcl">';

      h += '<button type="button" class="bcr" data-bm="open" data-k="' + esc(r.it.s) + '" aria-label="' + esc(aria) + '">'

        + '<span class="bcm"><span class="bcn">' + esc(nm) + '</span><span class="bcs' + (un ? ' un' : '') + '">' + esc(sn) + '</span></span>'
        + '<span class="bcw"><span class="bct' + (un ? ' un' : '') + '">' + (r.last ? esc(bcWhen(r.last.t)) : '') + '</span>'
        + (un ? '<span class="bcb">' + (un > 99 ? '99+' : un) + '</span>' : '') + '</span></button>';
    });
    h += '</div><p class="bmnote">Yazdığın mesajı şubedeki herkes görür; çalışanların cevapları da burada çıkar. Konuşman bitince geri dön, başka bir şey gerekmez.</p>';
  }
  box.innerHTML = h;

/* ----- konuşma ekranı ----- */
function bcAllMsgs(th){
  var a = [], pe = [], id;
  for (id in th.map) if (th.map.hasOwnProperty(id)) a.push(th.map[id]);
  a.sort(function(x, y){ return x.t - y.t || (x.id < y.id ? -1 : x.id > y.id ? 1 : 0); });
  for (id in th.pend) if (th.pend.hasOwnProperty(id) && !th.map[id]) pe.push(cxPendItem(id, th.pend[id]));
  pe.sort(function(x, y){ return x.t - y.t; });
  return a.concat(pe);                                                         /* gitmemiş mesajlar her zaman en altta */
}
function bcRenderThread(stick){
  var L = $('#bcList'), th, a, h = '', near;

function bcOlder(){

/* sh: doğrulanmış sayfa, st: stil listesi, z: büyütme, cap: ilk sütunun en büyük genişliği (px, 0 = sınırsız), me: vurgulanacak kişi (vdAscii biçiminde),
   av: kullanılabilir genişlik (px): tablo bundan genişse (yatay kaydırma gerekirse) geniş birleşik başlıklar sola yaslanır, yoksa yazının yarısı ekran dışında kalır */
function hubGrid(sh, st, z, cap, me, av){
  var ncol = sh.cw.length, occ = [], now, nxt, r, c, i, row, cell, col, cs, rs, w0, h, x, tw = 0, k, cls, mine;
  w0 = Math.round(sh.cw[0] * z); if (cap && w0 > cap) w0 = cap;
  for (c = 0; c < ncol; c++) occ.push(0);
  h = '';
  for (c = 0; c < ncol; c++){ x = c === 0 ? w0 : Math.round(sh.cw[c] * z); tw += x; h += '<col style="width:' + x + 'px">'; }
  h = '<table class="hb-g" role="presentation" style="width:' + tw + 'px"><colgroup>' + h + '</colgroup><tbody>';
  for (r = 0; r < sh.g.length; r++){
    row = sh.g[r]; col = 0; now = []; nxt = [];
    for (c = 0; c < ncol; c++){ now.push(occ[c] > 0); nxt.push(null); }
    mine = !!me && row.length > 0 && row[0][2] === 1 && vdAscii(row[0][0]) === me;
    h += '<tr' + (mine ? ' class="hb-me"' : '') + ' style="height:' + Math.max(8, Math.round(sh.rh[r] * z)) + 'px">';
    for (i = 0; i < row.length; i++){
      cell = row[i];
      while (col < ncol && now[col]) col++;
      if (col >= ncol) break;
      cs = Math.min(cell[2], ncol - col); rs = Math.min(cell[3], sh.g.length - r);
      for (k = col; k < col + cs; k++) now[k] = true;
      if (rs > 1) for (k = col; k < col + cs; k++) nxt[k] = rs - 1;
      cls = col === 0 && cs === 1 ? ' class="hb-s"' : '';
      h += '<td' + (cs > 1 ? ' colspan="' + cs + '"' : '') + (rs > 1 ? ' rowspan="' + rs + '"' : '') + cls + ' style="' + hubCellCss(st[cell[1]], z) + (cs >= 4 && av && tw > av ? 'text-align:left;padding-left:10px;' : '') + '">' + esc(cell[0]) + '</td>';
      col += cs;
    }
    h += '</tr>';
    for (c = 0; c < ncol; c++) occ[c] = nxt[c] != null ? nxt[c] : Math.max(0, occ[c] - 1);
  }
  return h + '</tbody></table>';
}

    else { if (s[k].got) got++; n += s[k].n; if (s[k].kl.length){ x = hubIdT(s[k].kl[0]); if (x > last) last = x; } }

    key = c.tid + ':' + c.k; c.pub = true;
    if (HUB.cmp[key] instanceof Array) HUB.cmp[key].push(c.id);                /* kendi yayınım «Yeni» görünmesin */
    hubSheetClose(true);
    hubLoad(c.tid, c.k);
    hubNote('Yayınlandı.', true);
    hubPush(t, c.k, function(g, n){ hubNote(hubPushMsg(t, 'Yayınlandı.', g, n), g === n); });
  }
  function rec(){ xhr('PUT', t.url('/yl/' + c.k + '/' + c.id + '.json?print=silent'), body, done, 60000); }
  if (s && !c.blobOk) xhr('PUT', t.url('/yp/' + c.aid + '.json?print=silent'), '{"t":{".sv":"timestamp"},"d":' + JSON.stringify(s.d) + ',"y":' + JSON.stringify(s.y) + '}', function(st){
    if (st >= 200 && st < 300){ c.blobOk = true; rec(); } else done(st);
  }, 180000);
  else rec();
}

/* ----- vardiya Excel'i: oku, önizle, yayınla ----- */
function hubXlErr(e){
  var m = e && typeof e.message === 'string' ? e.message : '';
  return m && m.length < 220 ? m : 'Bu dosya okunamadı. Excel (.xlsx) dosyası seç.';
}
function hubVdPick(file){
  var fr, t = hubCur();
  if (!file || !t || HUB.sec !== 'vd') return;
  if (file.size > HB_XL){ hubNote('Dosya çok büyük (' + cxSize(file.size) + '). Yalnızca vardiya Excel dosyasını seç.', false); return; }
  if (typeof FileReader === 'undefined' || !window.ArrayBuffer){ hubNote('Bu tarayıcı Excel dosyası okuyamıyor. Güncel Chrome ya da Edge kullan.', false); return; }
  hubNote('Excel okunuyor…', true);
  fr = new FileReader();
  fr.onload = function(){
    var m, ok, san = 0;
    try { m = vdParse(fr.result); san = m.san || 0; ok = hubVdOk(JSON.parse(JSON.stringify({ v:1, st:m.st, sh:m.sh }))); } catch(e){ hubNote(hubXlErr(e), false); return; }
    if (!ok || JSON.stringify(ok).length > 295000){ hubNote('Bu çizelge uygulamada gösterilemiyor. Yalnızca haftalık çizelgeyi içeren dosyayı yükle.', false); return; }
    hubNote('', true);
    hubVdPreview(ok, t, san);
  };
  fr.onerror = function(){ hubNote('Dosya okunamadı. Tekrar dene.', false); };
  fr.readAsArrayBuffer(file);
}
function hubVdPreview(m, t, san){
  var sh = m.sh[0];
  HUB.up = { m:m, tid:t.id, busy:false };
  hubSheetOpen('<div class="cxs-bg" data-hb="sx"></div><div class="cxs-p" role="document"><h3 class="hb-sh">Çizelgeyi yayınla</h3>'
    + '<p class="cxs-h">' + (BG.on ? esc(t.name) + ' · ' : '') + esc(sh.l || sh.n) + '</p>'
    + '<div class="hb-vs hb-pv">' + hubGrid(sh, m.st, 0.55, 0, '', Math.min(window.innerWidth, 520) - 50) + '</div>'
    + '<p class="cxs-h">Yayınlarsan ' + (BG.on ? esc(t.name) + ' personelinin' : 'şubedeki herkesin') + ' göreceği çizelge bu olur; eskisi değişir.' + (san ? ' Not: bazı hücre yazıları kısaltılarak gösterilecek.' : '') + '</p>'
    + '<div class="ch-msg" id="hbMsg" role="status" aria-live="polite"></div>'
    + '<button type="button" class="cxs-b hb-pub" id="hbOk" data-hb="vdok"><span>Yayınla</span></button><button type="button" class="cxs-b g" data-hb="sx"><span>Vazgeç</span></button></div>');
  try { $('#hbOk').focus(); } catch(e){}
}
function hubVdGo(){
  var u = HUB.up, t = u ? hubTgt(u.tid) : null, me = hubMe(), j, body, gen = HUB.gen, b;
  if (!u || u.busy || !t) return;
  if (!me){ cxNote(HBE, 'Önce adını seç (Ayarlar).', false); return; }
  u.busy = true; b = $('#hbOk'); if (b) b.disabled = true;
  cxNote(HBE, 'Gönderiliyor…', true);
  j = JSON.stringify(u.m);
  body = '{"t":{".sv":"timestamp"},"j":' + JSON.stringify(j) + ',"u":' + JSON.stringify(me) + '}';
  xhr('PUT', t.url('/vd.json?print=silent'), body, function(st){
    var ok = st >= 200 && st < 300;
    if (gen !== HUB.gen) return;
    u.busy = false;
    if (!ok){
      if (HUB.up === u){ b = $('#hbOk'); if (b) b.disabled = false; cxNote(HBE, st === 400 || st === 401 || st === 403 ? hubRules() : 'Gönderilemedi. İnternet bağlantını kontrol edip tekrar dene.', false); }
      return;
    }
    hubSheetClose(true);
    HUB.vi = 0;
    hubLoad(u.tid, 'vd');
    hubNote('Çizelge yayınlandı.', true);
    hubPush(t, 'vd', function(g, n){ hubNote(hubPushMsg(t, 'Çizelge yayınlandı.', g, n), g === n); });
  }, 60000);
}

/* ----- yayını kaldır ----- */
function hubRmAsk(id){
  var it = hubItem(id), t = hubCur();
  if (!it || !t || !hubCanRm(it)) return;
  HUB.rm = { tid:t.id, k:HUB.sec, id:id, a:it.a, busy:false };
  hubSheetOpen('<div class="cxs-bg" data-hb="sx"></div><div class="cxs-p" role="document"><h3 class="hb-sh">Yayını kaldır</h3>'
    + '<p class="cxs-h">«' + esc(it.b) + '» herkesten kalkar. Geri alınamaz.</p><div class="ch-msg" id="hbMsg" role="status" aria-live="polite"></div>'
    + '<button type="button" class="cxs-b er" id="hbOk" data-hb="rmok"><span>Evet, kaldır</span></button><button type="button" class="cxs-b g" data-hb="sx"><span>Vazgeç</span></button></div>');
  try { $('#hbOk').focus(); } catch(e){}
}
function hubRmDo(){
  var r = HUB.rm, t = r ? hubTgt(r.tid) : null, gen = HUB.gen, b;
  if (!r || r.busy || !t) return;
  r.busy = true; b = $('#hbOk'); if (b) b.disabled = true;
  xhr('PUT', t.url('/yl/' + r.k + '/' + r.id + '.json?print=silent'), 'null', function(st){
    if (gen !== HUB.gen) return;
    r.busy = false;
    if (st >= 200 && st < 300){
      if (r.a) hubBlobDel(t, r.a);
      hubSheetClose(true); hubLoad(r.tid, r.k); hubNote('Yayın kaldırıldı.', true);
    } else {
      b = $('#hbOk'); if (b) b.disabled = false;
      cxNote(HBE, st === 400 || st === 401 || st === 403 ? hubRules() : 'Kaldırılamadı. İnternet bağlantını kontrol edip tekrar dene.', false);
    }
  });
}

/* ----- yayını aç (fotoğraf / PDF / Excel / yalnız yazı): sohbetteki ek görüntüleyicisi kullanılır ----- */
function hubInfoHtml(it){
  return '<p class="cxv-n hb-vn">' + (it.s ? esc(it.s).replace(/\n/g, '<br>') + '<br>' : '') + '<i>' + esc(it.n) + ' · ' + esc(hubWhen(it.t)) + '</i></p>';
}
function hubPubOpen(id){
  var it = hubItem(id), t = hubCur();
  if (!it || !t) return;
  if (it.a) hubAttOpen(t, it); else hubTextOpen(it);
}
function hubTextOpen(it){
  var v = cxViewEl(), body = $('#cxvB'), act = $('#cxvA');
  CXS.view = { aid:'', name:it.b, blob:null, from:document.activeElement };
  $('#cxvT').textContent = it.b;
  body.innerHTML = '<div class="hb-rd"><b>' + esc(it.b) + '</b>' + hubInfoHtml(it) + '</div>'; act.innerHTML = ''; v.hidden = false;
  try { $('.cxv-x', v).focus(); } catch(e){}
}
function hubAttOpen(t, it){
  var v = cxViewEl(), body = $('#cxvB'), act = $('#cxvA'), cur, info = hubInfoHtml(it);
  CXS.view = cur = { aid:it.a, name:it.an, blob:null, from:document.activeElement };
  $('#cxvT').textContent = it.b;
  body.innerHTML = (it.at === 'i' && it.th ? '<img class="cxv-img pre" src="' + esc(it.th) + '" alt="">' : '') + '<p class="cxv-n">Yükleniyor…</p>';
  act.innerHTML = ''; v.hidden = false;
  try { $('.cxv-x', v).focus(); } catch(e){}
  cxBlobGet({ url:function(p){ return t.url('/yp/' + p.slice(3)); } }, it.a, function(st, j){
    var blob, y;
    if (CXS.view !== cur) return;
    if (!j){ body.innerHTML = '<p class="cxv-n">' + (st === 404 ? 'Bu yayının eki artık yok.' : 'Açılamadı. İnternet bağlantını kontrol edip tekrar dene.') + '</p>' + info; return; }
    y = hubOpenOk(j.y) ? j.y : 'application/octet-stream';                       /* sayfa gibi çalışabilecek türler uygulamanın içinde açılmaz, yalnızca kaydedilir */
    try { blob = cxB64Blob(j.d, y); } catch(e){ body.innerHTML = '<p class="cxv-n">Bu ek açılamadı.</p>' + info; return; }
    cur.blob = blob;
    if (it.at === 'i'){
      body.innerHTML = '<img class="cxv-img" alt="Fotoğraf">' + info;
      $('.cxv-img', body).src = 'data:' + (/^image\/(jpeg|png|webp|gif)$/i.test(j.y) ? j.y : 'image/jpeg') + ';base64,' + j.d;
      act.innerHTML = '<button type="button" class="cxs-b" data-cxv="save"><span class="cxs-i">' + IC.dl + '</span><span>Kaydet</span></button>';
    } else {
      body.innerHTML = '<div class="cxv-f"><span class="cfi">' + IC.clip + '</span><b>' + esc(it.an) + '</b><i>' + esc(cxSize(it.as)) + '</i></div>' + info;
      act.innerHTML = (hubOpenOk(j.y) ? '<button type="button" class="cxs-b" data-cxv="open"><span>Aç</span></button>' : '') + '<button type="button" class="cxs-b g" data-cxv="save"><span class="cxs-i">' + IC.dl + '</span><span>Kaydet</span></button>';
    }
  });
}

/* ----- düzen, açma/kapama, olaylar ----- */
function hubFit(){
  var c = $('#hub'), v = window.visualViewport;
  if (!c || c.hidden) return;
  if (v){ c.style.height = Math.round(v.height) + 'px'; c.style.top = Math.round(v.offsetTop) + 'px'; }
  else { c.style.height = window.innerHeight + 'px'; c.style.top = '0px'; }
}
function hubTop(){                                                             /* hub'ın üstünde başka katman açık değil mi */
  var ids = ['chat', 'bchat', 'cxv', 'cxs', 'ident'], i, e;
  for (i = 0; i < ids.length; i++){ e = $('#' + ids[i]); if (e && !e.hidden) return false; }
  return true;
}
function hubClick(e){
  var b = e.target, a = '', root = $('#hub');
  if (cxClick(HBE, e)) return;
  while (b && b !== root && !(b.getAttribute && b.getAttribute('data-hb'))) b = b.parentNode;
  a = b && b !== root ? b.getAttribute('data-hb') : '';
  if (!a) return;
  if (a === 'back') hubBack();
  else if (a === 'act') hubAct();
  else if (a === 'sec') hubOpenSec(b.getAttribute('data-k'));
  else if (a === 'tgt') hubPickTid(b.getAttribute('data-t'), false);
  else if (a === 'pub') hubPubOpen(b.getAttribute('data-id'));
  else if (a === 'rm') hubRmAsk(b.getAttribute('data-id'));
  else if (a === 'rmok') hubRmDo();
  else if (a === 'retry') hubEnsure(true);
  else if (a === 'zi' || a === 'zo') hubZoom(a === 'zi' ? 1 : -1);
  else if (a === 'vtab') hubVTab(parseInt(b.getAttribute('data-i'), 10));
  else if (a === 'send') hubSend();
  else if (a === 'vdok') hubVdGo();
  else if (a === 'sx') hubSheetClose(false);
}
function hubAct(){
  if (!hubCur() || HUB.page !== 'sec') return;
  if (HUB.sec === 'vd'){ try { $('#hbXl').click(); } catch(e){} } else hubCompose();
}
function hubBack(){
  var s = $('#hubSheet');
  if (s && !s.hidden){ hubSheetClose(false); return; }
  if (HUB.page === 'sec'){ HUB.page = 'home'; HUB.sec = ''; hubNote('', true); hubRender(); return; }
  hubClose();
}
function hubBuild(){
  var c = $('#hub');
  if (c) return c;
  c = el('div'); c.id = 'hub'; c.setAttribute('role', 'dialog'); c.setAttribute('aria-modal', 'true'); c.setAttribute('aria-labelledby', 'hubTitle'); c.hidden = true;
  c.innerHTML = '<div class="hb-wrap"><div class="hb-top"><button class="ch-back" type="button" data-hb="back" aria-label="Geri">' + IC.back + '</button>'
    + '<div class="ch-ti"><b id="hubTitle">Hızlı erişim</b><span id="hubSub"></span></div>'
    + '<button type="button" class="hb-act" id="hubAct" data-hb="act" hidden></button></div>'
    + '<div class="hb-tg" id="hubTg" role="tablist" aria-label="Şube" hidden></div>'
    + '<div class="hb-msg" id="hubMsg" role="status" aria-live="polite" hidden></div>'
    + '<div class="hb-body" id="hubBody" tabindex="0"></div></div>'
    + '<div class="hb-sheet" id="hubSheet" hidden></div>'
    + '<input type="file" id="hbImg" accept="image/*" hidden tabindex="-1" aria-hidden="true">'
    + '<input type="file" id="hbFil" hidden tabindex="-1" aria-hidden="true">'
    + '<input type="file" id="hbXl" accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden tabindex="-1" aria-hidden="true">';
  document.body.appendChild(c);
  c.addEventListener('click', hubClick);
  cxBind(HBE);
  $('#hbXl').addEventListener('change', function(){ var f = this.files && this.files[0]; this.value = ''; if (f) hubVdPick(f); });
  return c;
}
function hubOpen(){
  var c;
  if (!hubTargets().length) return;
  c = hubBuild();
  HUB.from = document.activeElement; HUB.open = true; HUB.page = 'home'; HUB.sec = ''; HUB.rk = ''; HUB.sig = '';
  c.hidden = false; document.documentElement.classList.add('hubopen');
  hubFit(); hubRender(); hubTick();
  try { $('.ch-back', c).focus(); } catch(e){}
}
function hubClose(){
  var c = $('#hub');
  HUB.open = false;
  if (c){ hubSheetClose(true); c.hidden = true; }
  document.documentElement.classList.remove('hubopen');
  hubSched(); hubDot();
  if (HUB.from && HUB.from.focus && document.body.contains(HUB.from)){ try { HUB.from.focus(); } catch(e){} }
  HUB.from = null;
}
/* bağlantı ya da şube listesi değişince */
function hubCfg(){
  var ts = hubTargets(), key = BG.on ? ts.map(function(t){ return t.id + ':' + t.k; }).join(',') : (E.cfg ? E.cfg.k : ''), b = $('#btnHub');
  if (HUB.key !== key){
    HUB.key = key; HUB.gen++; HUB.st = {}; HUB.busy = false; HUB.cmp = {}; HUB.ready = false; clearTimeout(HUB.tm); HUB.tm = 0;
    if (HUB.open) hubClose();
    hubSeenLoad();
    if (ts.length) setTimeout(hubTick, 1200);
  }
  if (b) b.hidden = !ts.length;
  hubDot();
}
function hubInit(){
  var b = $('#btnHub');
  if (!b || HUB.inited) return;
  HUB.inited = true;
  b.innerHTML = IC.hub + '<i class="hdot" id="hubDot" hidden></i>';
  b.addEventListener('click', hubOpen);
  window.addEventListener('online', function(){ hubTick(); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) hubTick(); });
  document.addEventListener('keydown', function(e){ if (HUB.open && (e.key === 'Escape' || e.keyCode === 27) && hubTop()) hubBack(); });
  window.addEventListener('resize', hubFit);
  if (window.visualViewport){ window.visualViewport.addEventListener('resize', hubFit); window.visualViewport.addEventListener('scroll', hubFit); }
  hubCfg();
}
/* ---------- başlat ---------- */
function init(){
  loadSnap(); SNAP.t = V.meta.stamp || 0; setData(V);
  $('#defs').innerHTML = defsHTML();
  prefInit();
  if (BG.on){ bgInit(); return; }
  initEntry();
  chInit();
  hubInit();
  pushBoot();
  pwaUpdate();
  buildViews();
  initTabs();
  $('#btnSet').addEventListener('click', openSheet);
  layoutWide(); window.addEventListener('resize', layoutWide);
  fitAll();
  $('#btnAll').addEventListener('click', function(){ var o = !allOpen(); CARDS.forEach(function(c){ setOpen(c, o); }); });
  window.addEventListener('resize', setHH);
  window.addEventListener('load', setHH);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(setHH);
  applyAnim();
  playIn(document.body);
  setTimeout(function(){ $('#main').classList.remove('enter'); }, 3200);
  identInit();
}
init();
})();
</script>
