<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070A18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gidişat" id="amt">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" type="image/png" href="icon-512.png" id="ic1">
<link rel="apple-touch-icon" href="icon-512.png" id="ic2">
<link rel="manifest" id="mf">
<title>Şube Gidişat</title>
<script>
/* Tema: sayfa çizilmeden önce uygulanır (açık tema seçiliyken koyu renk bir an görünmesin). Seçim bu cihazda saklanır (gk_pref). */
(function(){
  var D = document.documentElement, BG = {"gece":"#070A18","okyanus":"#05193A","mor":"#150B2E","gun":"#EDF1F8","nane":"#E3F3EA","seftali":"#FBEBE0"}, LIGHT = {"gun":1,"nane":1,"seftali":1};
  function pick(t){
    if (t === 'otomatik'){
      var l = false;
      try { l = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches); } catch(e){}
      return l ? 'gun' : 'gece';
    }
    return BG.hasOwnProperty(t) ? t : 'gece';
  }
  window.__gkBg = function(){ return BG[D.getAttribute('data-tema')] || BG.gece; };
  window.__gkTema = function(t){
    var r = pick(t), m = document.querySelector('meta[name="theme-color"]'), c = document.querySelector('meta[name="color-scheme"]');
    D.setAttribute('data-tema', r);
    if (LIGHT[r]) D.setAttribute('data-theme', 'light'); else D.removeAttribute('data-theme');
    if (m) m.setAttribute('content', BG[r]);
    if (c) c.setAttribute('content', LIGHT[r] ? 'light' : 'dark');
    return r;
  };
  var t = 'gece';
  try { var p = JSON.parse(window.localStorage.getItem('gk_pref') || 'null'); if (p && typeof p.tema === 'string') t = p.tema; } catch(e){}
  window.__gkTema(t);
})();
</script>
<style>
/* Tasarım planı (v10) — "Skorbord", üç sekme (Gidişat | Gereken | Giriş), telefon + tablet + bilgisayar
   Üstte sabit alan: dönem + sekmeler (Gidişat | Günlük gereken), ayın günleri ışık dizisi ve şube paneli (dönen ışıklı çerçeve).
   Gidişat: şube paneli + personel kartları; kutu doluluğu gidişatı gösterir (tam dolu = %100 ve üstü); sıra ve madalya adın yanında,
   madalyanın çevresindeki halka genel puanı gösterir. Sayılar sayarak yükselir, kutular alttan dolar.
   Günlük gereken: Excel'deki "Bugün yapılması gereken" bölümlerinin aynısı (şubede 8, personelde 6 başlık); büyük sayı bugün gereken, altta kalan.
   Hareket her zaman açık (anahtar yok, cihaz ayarına bakılmaz); sakin görünüm gerekirse adresin sonuna #sakin eklenir.
   Renk: gece mavisi zemin, ışık için camgöbeği + mor; durum renkleri (yeşil/sarı/kırmızı) yalnızca durum için, ikon ve yüzdeyle. */
:root{
  color-scheme:dark;
  --bg:#070A18;--bgRgb:7,10,24;--ring:#0A0F2B;--card:#101637;--glow:#141C52;--card2:#161E4A;--card3:#0E1330;--cy:#3CD7FF;--cyRgb:60,215,255;--cyL:#9FE6FF;--vi:#8B7BFF;--viRgb:139,123,255;--viL:#B9AEFF;--b1:#5B6CFF;--b2:#3A46C9;--lineRgb:140,160,255;
  --line:rgba(var(--lineRgb),.16);--line2:rgba(var(--lineRgb),.3);
  --ink:#F2F5FF;--ink2:#B7C1E3;--muted:#8D99C2;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
.good{--c:#34F0A0;--c2:#10B676;--cg:rgba(52,240,160,.55);--cw:rgba(52,240,160,.09);--fa:rgba(52,240,160,.46);--fb:rgba(52,240,160,.14)}
.warn{--c:#FFC94D;--c2:#F29A1F;--cg:rgba(255,201,77,.5);--cw:rgba(255,201,77,.09);--fa:rgba(255,201,77,.46);--fb:rgba(255,201,77,.14)}
.bad{--c:#FF5C7A;--c2:#E0314F;--cg:rgba(255,92,122,.55);--cw:rgba(255,92,122,.09);--fa:rgba(255,92,122,.46);--fb:rgba(255,92,122,.14)}
.accent{--c:var(--cy);--c2:var(--vi);--cg:rgba(var(--cyRgb),.5)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
html,body{margin:0;padding:0}
body{position:relative;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;padding-bottom:calc(30px + env(safe-area-inset-bottom));min-height:100vh}
h1,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
svg{display:block}
b,small,em{font-style:normal}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:8px}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.cu{font-variant-numeric:tabular-nums}

/* arka plan ışıkları */
.aurora{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(120% 70% at 50% -10%,var(--glow) 0%,rgba(var(--bgRgb),0) 62%)}
.aurora i{position:absolute;display:block;width:70vmax;height:70vmax;border-radius:50%;left:-30vmax;top:-30vmax;background:radial-gradient(closest-side,rgba(var(--cyRgb),.17),rgba(var(--cyRgb),0))}
.aurora i+i{left:auto;top:auto;right:-35vmax;bottom:-35vmax;background:radial-gradient(closest-side,rgba(var(--viRgb),.2),rgba(var(--viRgb),0))}
.aurora::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;opacity:.45;background-image:radial-gradient(1px 1px at 22px 34px,rgba(255,255,255,.7),rgba(255,255,255,0)),radial-gradient(1px 1px at 96px 118px,rgba(190,225,255,.55),rgba(255,255,255,0)),radial-gradient(1.4px 1.4px at 150px 62px,rgba(255,255,255,.6),rgba(255,255,255,0)),radial-gradient(1px 1px at 58px 150px,rgba(255,210,150,.5),rgba(255,255,255,0));background-size:176px 164px}
.anim .aurora::after{animation:stars 5s ease-in-out infinite alternate}
@keyframes stars{from{opacity:.2}to{opacity:.62}}
.anim .aurora i{animation:drift 24s ease-in-out infinite alternate}
.anim .aurora i+i{animation-duration:30s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(22vmax,16vmax) scale(1.15)}}

/* sabit üst alan: dönem + sekmeler, gün ışıkları, şube paneli */
.top{position:sticky;top:0;z-index:20;padding-top:5px;background:rgba(var(--bgRgb),.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line2);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.trow{display:flex;align-items:center;justify-content:space-between;height:38px;margin-bottom:3px}
.brand h1{font-size:17px;font-weight:850;letter-spacing:-.02em;line-height:1.05;background:linear-gradient(90deg,#FFFFFF,var(--cyL) 70%,var(--viL));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
.brand span{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.tabs{position:relative;display:flex;flex:none;padding:3px;border-radius:15px;background:rgba(255,255,255,.06);border:1px solid var(--line2)}
.tab{position:relative;z-index:1;padding:7px 13px;border-radius:12px;font-size:12.5px;font-weight:780;line-height:1.1;color:var(--ink2);white-space:nowrap;transition:color .3s}
.tab[aria-selected="true"]{color:#06101C}
.tabpill{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:12px;background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 16px rgba(var(--cyRgb),.55)}
.anim .tabpill{transition:transform .38s cubic-bezier(.3,.9,.3,1),width .38s cubic-bezier(.3,.9,.3,1)}
.tab:active{transform:scale(.96)}
.days{display:flex;height:5px;margin:0 0 6px}
.bulb{flex:1 1 0;min-width:0;border-radius:3px;background:rgba(255,255,255,.1)}
.bulb+.bulb{margin-left:3px}
.bulb.on{background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 7px rgba(var(--cyRgb),.65)}
.anim .bulb.on{animation:lit .35s ease-out backwards;animation-delay:calc(var(--n)*22ms)}
.anim .bulb.now{animation:lit .35s ease-out backwards,nowblink 1.2s ease-in-out infinite;animation-delay:calc(var(--n)*22ms),.9s}
@keyframes lit{from{opacity:0;transform:scaleY(.2)}}
@keyframes nowblink{0%,100%{opacity:1;box-shadow:0 0 7px rgba(var(--cyRgb),.65)}50%{opacity:.4;box-shadow:0 0 15px rgba(var(--cyRgb),1)}}

/* animasyon: her zaman açık (yalnızca adreste #sakin varsa kapalı) */
html:not(.anim) *,html:not(.anim) *::before,html:not(.anim) *::after{animation:none!important;transition:none!important}
.anim .fl{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.anim .fill{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.anim .enter .stg{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* şube paneli */
.store{position:relative;margin-bottom:7px;padding:1.5px;border-radius:17px;background:var(--card);overflow:hidden;isolation:isolate;box-shadow:0 0 22px -6px rgba(var(--cyRgb),.45),0 0 0 1px rgba(var(--lineRgb),.14)}
.store::before{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:170%;height:0;padding-top:170%;margin:-85% 0 0 -85%;background:conic-gradient(from 0deg,rgba(var(--cyRgb),0) 0%,rgba(var(--cyRgb),.16) 38%,var(--cy) 60%,var(--vi) 72%,#FF6FD8 79%,rgba(var(--viRgb),0) 90%,rgba(var(--cyRgb),0) 100%)}
.anim .store::before{animation:orbit 5.5s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.anim .store:not([hidden]){animation:panin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes panin{from{opacity:0;transform:translateY(-8px) scale(.985)}}
.stin{position:relative;padding:4.5px 5.5px 5.5px;border-radius:15.5px;overflow:hidden;background:linear-gradient(180deg,rgba(var(--cyRgb),.11),rgba(var(--viRgb),.06)),var(--card)}
.stin::before{content:"";position:absolute;z-index:0;top:0;right:0;bottom:0;left:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.08) 1px,rgba(255,255,255,0) 1.3px);background-size:7px 7px;-webkit-mask-image:linear-gradient(180deg,#000,rgba(0,0,0,0) 88%);mask-image:linear-gradient(180deg,#000,rgba(0,0,0,0) 88%)}
.stin::after{content:"";position:absolute;z-index:2;top:0;bottom:0;left:0;width:34%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.1),rgba(255,255,255,0));transform:translateX(-130%);pointer-events:none;opacity:0}
.anim .stin::after{opacity:1;animation:sheen 5.5s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-130%)}45%,100%{transform:translateX(420%)}}
.stin>.sthead,.stin>.tr{position:relative;z-index:1}
.sthead{display:flex;align-items:center;padding:0 3px 5px}
.stname{font-size:12.5px;font-weight:750;color:var(--ink);white-space:nowrap}
.stcn{display:flex;align-items:center;margin-left:auto;margin-right:12px}
.cn{display:inline-flex;align-items:center}
.cn+.cn{margin-left:9px}
.cn .d{width:15px;height:15px;border-radius:50%;background:var(--c);color:#07101C;display:grid;place-items:center;flex:none;box-shadow:0 0 8px var(--cg)}
.cn .d svg{width:9px;height:9px}
.cn b{margin-left:4px;font-size:13px;font-weight:800;color:var(--ink)}
.anim .good.cn .d{animation:ping 3s ease-out infinite}
.anim .warn.cn .d{animation:ping 2.2s ease-out infinite}
.anim .bad.cn .d{animation:ping 1.5s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--cg)}70%,100%{box-shadow:0 0 0 7px rgba(0,0,0,0)}}
.stscore{font-size:21px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--cy);text-shadow:0 0 14px rgba(var(--cyRgb),.6)}

/* gidişat kutuları (5 + 6) */
.tr{display:flex;align-items:stretch}
.tr+.tr{margin-top:5px}
.tr>*+*{margin-left:5px}
.t{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:space-between;min-height:38px;padding:3px 4px 3px 5px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.09);text-align:left}
.t.good,.t.warn,.t.bad{background:var(--cw);border-color:var(--fb);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 0 12px -7px var(--cg)}
.t .fill{position:absolute;left:0;right:0;top:0;bottom:0;transform-origin:50% 100%;transform:scaleY(0);background:linear-gradient(180deg,var(--fa),var(--fb));pointer-events:none}
.t>.tl,.t>.tv,.t>.ts,.t>.ti{position:relative;z-index:1}
.tl{display:block;font-size:9.5px;line-height:11px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.t>.ti{position:absolute;top:3px;right:3px;width:9px;height:9px;color:var(--c)}
.ti svg{width:9px;height:9px}
.tv{display:block;font-size:15px;line-height:18px;font-weight:850;letter-spacing:-.03em;color:var(--c);text-shadow:0 0 10px var(--cg);white-space:nowrap}
.tv.x1{font-size:12px}
.tv.x2{font-size:10.5px}
.ts{display:block;font-size:9px;line-height:10px;font-weight:650;color:var(--ink2);letter-spacing:0;white-space:nowrap}
.t.mma:not(.good):not(.bad) .tv{color:var(--ink);text-shadow:none}
.anim .store .t.good{animation:tpulse 2.8s ease-in-out infinite}
@keyframes tpulse{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 0 14px var(--cg)}}

/* şube panelindeki küçük tutar kutuları */
.tx{position:relative;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:3px 5px 4px 6px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);text-align:left}
.tx.good,.tx.warn,.tx.bad{background:var(--cw);border-left:3px solid var(--c);padding-left:4px}
.tx-a{flex:6.4 1 0}
.tx-s{flex:6.3 1 0}
.tx-o{flex:5.1 1 0}
.tx-p{flex:10.3 1 0}
.txl{display:flex;align-items:center;justify-content:space-between;font-size:9.5px;line-height:11px;color:var(--ink2);white-space:nowrap}
.txn{min-width:0;overflow:hidden}
.txl .txi,.txl .txp{flex:none;margin-left:3px}
.txi{width:9px;height:9px;color:var(--c)}
.txi svg{width:9px;height:9px}
.txc{font-weight:850;color:var(--c);letter-spacing:-.01em}
.txv{display:block;font-size:13px;line-height:17px;font-weight:850;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.txv small{font-size:9px;font-weight:650;color:var(--ink2);letter-spacing:0}
.txv.x1{font-size:11.5px}
.txv.x2{font-size:10px}
.txs{display:flex;justify-content:space-between;align-items:baseline;gap:3px;font-size:9px;line-height:10px;font-weight:650;color:var(--ink2);white-space:nowrap}
.txp{font-size:12px;font-weight:850;color:var(--ink);letter-spacing:-.02em}
.txp small{font-size:9px;font-weight:650;color:var(--ink2);letter-spacing:0}
.txr{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;line-height:11px;font-weight:650;color:var(--ink2);white-space:nowrap}
.txr b{font-size:10.5px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.tx .z,.tx .z b{color:var(--muted)}

/* tutar kutuları */
.tw{position:relative;flex:1 1 0;min-width:0;padding:6px 9px 7px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);overflow:hidden}
.tw.good,.tw.warn,.tw.bad{background:var(--cw);border-left:3px solid var(--c)}
.twl{display:flex;align-items:center;justify-content:space-between;font-size:11px;line-height:14px;color:var(--ink2)}
.twc{display:inline-flex;align-items:center;font-weight:800;color:var(--c)}
.twc svg{width:9px;height:9px;margin-right:3px}
.twv{display:flex;align-items:baseline;justify-content:space-between;margin-top:3px;white-space:nowrap}
.twv b{font-size:16px;font-weight:850;letter-spacing:-.02em;color:var(--ink)}
.twv small{font-size:12px;font-weight:600;color:var(--ink2)}
.twv .v2 b{font-size:14px;font-weight:750}
.twv .v2 em{font-size:10.5px;color:var(--ink2)}
.twv .z b{color:var(--muted)}

/* günlük gereken kutuları: şubede ve kartlarda aynı 4+4+3 düzen (şubenin 12. gözü: tarih) */
.dt{min-height:54px;padding:4px 4px 4px 5px;justify-content:flex-start}
.dt .tl{font-size:10px;line-height:12px}
.t>.tvr{position:relative;z-index:1}
.tvr{display:flex;align-items:baseline;margin-top:3px;white-space:nowrap}
.dt .tv{font-size:17px;line-height:19px}
.dt .tv.x1{font-size:14px}
.dt .tv.x2{font-size:11.5px}
.dt .tv.done{font-size:14px}
.tu{margin-left:3px;font-size:10px;font-weight:700;color:var(--ink2)}
.dt .ts{margin-top:auto;padding-top:3px;font-size:9.5px;line-height:11px;white-space:normal;overflow-wrap:anywhere}
.dt .ts b{font-weight:750;color:var(--ink)}
.dt .ts.x1{font-size:8.5px}
.store .dt{min-height:48px;padding:3px 3px 3px 5px}
.store .tvr{margin-top:2px}
.store .dt .ts{padding-top:1px}
.dinfo{background:rgba(var(--cyRgb),.09);border-color:rgba(var(--cyRgb),.42)}
.dinfo .tl{color:var(--cy)}
.dinfo .tv{color:#fff;font-weight:850}
.dc{padding:9px 8px 10px}
.dc .dhead{display:flex;align-items:center;margin-bottom:8px}
.dc .dhead>*+*{margin-left:8px}
.dc .tr+.tr{margin-top:5px}
#listG{padding-top:12px}

/* madalyalar ve sıra rozetleri */
.bdg{position:relative;flex:none;width:56px;height:56px;display:grid;place-items:center}
.bdg .medal{position:relative;z-index:1;width:44px;height:48px}
.ring{position:absolute;left:0;top:0;width:56px;height:56px;transform:rotate(-90deg);overflow:visible;pointer-events:none}
.ring .rb{fill:none;stroke:rgba(255,255,255,.1);stroke-width:2.2}
.ring .rf{fill:none;stroke:var(--cy);stroke-width:2.8;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:100;filter:drop-shadow(0 0 3px rgba(var(--cyRgb),.9))}
.anim .ring .rf{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.medal{overflow:visible;color:#FFD24A;filter:drop-shadow(0 0 4px currentColor)}
.medal.silver{color:#DCE4F5}
.medal.bronze{color:#E59A5C}
.medal text{font-family:var(--font);font-size:20px;font-weight:900;text-anchor:middle;stroke:rgba(255,255,255,.4);stroke-width:.6px;paint-order:stroke}
.medal.gold text{fill:#5A3A00}
.medal.silver text{fill:#2B3550}
.medal.bronze text{fill:#4B2208}
.medal .rib.a{fill:var(--b1)}
.medal .rib.b{fill:var(--b2)}
.medal .shine{fill:rgba(255,255,255,.75)}
.medal .sp{fill:#fff;opacity:.85;transform-box:fill-box;transform-origin:center}
html:not(.anim) .medal .shine{display:none}
.anim .medal{animation:mglow 1.8s ease-in-out infinite}
.anim .medal .shine{animation:shine 3.4s ease-in-out infinite}
.anim .medal .sp{animation:twinkle 1.7s ease-in-out infinite backwards}
.anim .medal .s2{animation-delay:.55s}
.anim .medal .s3{animation-delay:1.1s}
@keyframes mglow{0%,100%{filter:drop-shadow(0 0 2px currentColor)}50%{filter:drop-shadow(0 0 10px currentColor)}}
@keyframes shine{0%{transform:translateX(-24px)}55%,100%{transform:translateX(70px)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0deg)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
.rk{position:relative;z-index:1;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.06);font-size:17px;font-weight:800;color:var(--ink)}
.rk.sico{color:var(--cy);box-shadow:0 0 12px rgba(var(--cyRgb),.25)}
.rk.sico svg{width:22px;height:22px}

/* yanıp sönen ampuller (1. sıradaki kart) */
.marq{--bulb:#FFD24A;position:relative;height:7px;overflow:hidden;display:none}
.marq::before,.marq::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:radial-gradient(circle at 6px 3.5px,var(--bulb) 0 2.3px,rgba(0,0,0,0) 3px) 0 0/24px 7px repeat-x;filter:drop-shadow(0 0 2px var(--bulb))}
.marq::after{background-position:12px 0}
.anim .marq::before{animation:bulbA 1.2s steps(1) infinite}
.anim .marq::after{animation:bulbB 1.2s steps(1) infinite}
@keyframes bulbA{0%{opacity:1}50%{opacity:.2}}
@keyframes bulbB{0%{opacity:.2}50%{opacity:1}}

/* tümünü aç */
.ctl{display:flex;justify-content:flex-end;margin:10px 2px 8px}
.lnk{flex:none;font-size:13px;font-weight:700;color:var(--cy);text-decoration:underline;text-underline-offset:3px;padding:3px 0;white-space:nowrap}

/* personel kartları */
.pc{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02)),var(--card);border:1px solid var(--line);border-radius:20px;margin-top:10px;overflow:hidden}
.pc:first-child{margin-top:0}
.pc.r1{border-color:rgba(255,210,74,.55);background:linear-gradient(180deg,rgba(255,210,74,.12),rgba(255,210,74,.02)),var(--card);box-shadow:0 0 0 1px rgba(255,210,74,.1),0 8px 30px rgba(255,210,74,.13)}
.pc.r2{border-color:rgba(220,228,245,.38)}
.pc.r3{border-color:rgba(229,154,92,.42)}
.pc.sc{border-color:rgba(var(--cyRgb),.45);background:linear-gradient(180deg,rgba(var(--cyRgb),.1),rgba(var(--viRgb),.04)),var(--card)}
.pc.r1 .marq{display:block}
.pc.r1::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 34px rgba(255,210,74,.3);opacity:0}
.anim .pc.r1::after{animation:goldglow 3.2s ease-in-out infinite}
@keyframes goldglow{50%{opacity:1}}
.pbtn{display:block;width:100%;padding:10px 10px 11px}
.phead{display:flex;align-items:center}
.phead>*+*{margin-left:8px}
.pname{flex:1;min-width:0;font-size:16px;font-weight:750;line-height:1.2}
.psc{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.pscore{font-size:23px;font-weight:850;letter-spacing:-.03em;line-height:1.05;color:var(--cy);text-shadow:0 0 16px rgba(var(--cyRgb),.55)}
.plab{font-size:11px;color:var(--ink2);margin-top:1px}
.chev{width:16px;height:16px;color:var(--muted);flex:none;transition:transform .2s}
.pc.open .chev{transform:rotate(90deg)}
.pcoll{display:block;margin-top:9px}
.pbody{padding:0 12px 8px;border-top:1px solid var(--line)}
.psec{padding:14px 0 6px;border-top:1px solid var(--line)}
.kvs{display:grid;grid-template-columns:1fr 1fr;grid-column-gap:18px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv span{color:var(--ink2);white-space:nowrap}
.kv b{font-weight:650;text-align:right;white-space:nowrap}
.kh{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 2px}

/* açılan ayrıntı satırları */
.mrow{display:block;width:100%;padding:13px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mtop{display:flex;justify-content:space-between;align-items:center}
.mtop .r{display:flex;align-items:center}
.mname{font-size:15px;font-weight:700}
.mpct{font-size:21px;font-weight:850;letter-spacing:-.03em;color:var(--c);text-shadow:0 0 16px var(--cg)}
.bar{display:block;position:relative;height:10px;border-radius:6px;background:rgba(255,255,255,.08);margin:10px 0 12px}
.bar .fl{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:linear-gradient(90deg,var(--c2),var(--c));box-shadow:0 0 12px var(--cg);overflow:hidden}
.bar .fl::after{content:"";position:absolute;left:0;top:0;bottom:0;width:40%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));transform:translateX(-110%);opacity:0}
.anim .bar .fl::after{opacity:1;animation:sweep 2.8s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-110%)}60%,100%{transform:translateX(320%)}}
.bar .t100{position:absolute;left:76.923%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.7;border-radius:1px}
.mnums{display:flex;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.mnums b{color:var(--ink);font-weight:650}
.nn{display:flex;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.nn>span{white-space:nowrap;margin-left:10px}
.st{display:inline-flex;align-items:center;font-size:13px;font-weight:650;color:var(--ink2);white-space:nowrap}
.st .d{width:17px;height:17px;border-radius:50%;background:var(--c);color:#07101C;display:grid;place-items:center;flex:none;box-shadow:0 0 8px var(--cg);margin-right:6px}
.st .d svg{width:11px;height:11px}
.st:not(.good):not(.warn):not(.bad) .d{display:none}
.anim .good .st .d{animation:ping 3s ease-out infinite}
.anim .warn .st .d{animation:ping 2.2s ease-out infinite}
.anim .bad .st .d{animation:ping 1.5s ease-out infinite}

@media (max-width:380px){
  .wrap{padding:0 11px}
  .pbtn{padding:9px 8px 10px}
  .t{padding:3px 2px 3px 4px}
  .tl{font-size:9px}
  .tv{font-size:13.5px;letter-spacing:-.04em}
  .ts{font-size:8.5px}
  .tx{padding:3px 3px 4px 5px}
  .tx.good,.tx.warn,.tx.bad{padding-left:3px}
  .txl{font-size:9px}
  .txv{font-size:12.5px}
  .txs,.txr{font-size:8.5px}
  .txr b{font-size:10px}
  .tw{padding:6px 7px 7px}
  .twv b{font-size:15px}
  .twv .v2 em{font-size:10px}
  .pscore{font-size:21px}
  .tab{padding:8px 11px}

  .dt .tv.x1{font-size:13.5px}
}
@media (max-width:340px){
  .stname{font-size:11.5px}
  .stcn{margin-right:7px}
  .cn+.cn{margin-left:6px}
  .stscore{font-size:19px}
  .tl{font-size:8px;letter-spacing:-.02em}
  .t>.ti,.ti svg{width:7px;height:7px}
  .t>.ti{right:2px}
  .tv{font-size:12.5px}
  .ts{font-size:7.5px;letter-spacing:-.03em}
  .txl{font-size:8px}
  .txi,.txi svg{width:7px;height:7px}
  .txv{font-size:11.5px}
  .txs,.txr{font-size:8px}
  .txr b{font-size:9.5px}
  .txp{font-size:11px}
  .tx-a{flex:6.9 1 0}
  .tx-o{flex:4.6 1 0}
  .twv b{font-size:14px}
  .twv .v2 b{font-size:12.5px}
  .twv .v2 em{font-size:9px}
  .pname{font-size:15px}
  .brand h1{font-size:15.5px}
  .tab{padding:7px 9px;font-size:11.5px}
  .dt .tv{font-size:13.5px}
  .dt .tv.x1{font-size:12px}
  .dt .tv.x2{font-size:10.5px}
  .dt .tv.done{font-size:12.5px}
  .dt .ts{font-size:8.5px;letter-spacing:-.02em}
  .dt .ts.x1{font-size:7.5px;letter-spacing:-.02em}
  .tu{font-size:9px}
  .dt{padding-right:3px}
  .dc{padding:8px 6px 9px}
}
@media (max-height:700px){
  .top{padding-top:4px}
  .trow{height:36px;margin-bottom:3px}
  .days{height:3px;margin-bottom:5px}
  .store{margin-bottom:5px}
  .stin{padding:3.5px 4.5px 4.5px}
  .sthead{padding-bottom:4px}
  .t{min-height:36px}
  .store .dt{min-height:44px;padding-top:2px;padding-bottom:2px}
  .store .tvr{margin-top:1px}
  .store .dt .ts{padding-top:0}
}
@media (min-width:600px){
  .dt{min-height:64px;padding:6px 7px}
  .store .dt{min-height:56px}
  .dt .tl{font-size:11.5px;line-height:13px}
  .dt .tv{font-size:22px;line-height:24px}
  .dt .tv.x1{font-size:18px}
  .dt .tv.x2{font-size:15px}
  .dt .tv.done{font-size:17px}
  .dt .ts{font-size:10.5px;line-height:12px}
  .dt .ts.x1{font-size:9.5px}
  .tu{font-size:11px}
}

/* ---- giriş sekmesi (v9): günlük işlemler, kişi başına elle girilen 17 kutu ---- */
.accent{--fa:rgba(var(--cyRgb),.34);--fb:rgba(var(--cyRgb),.1);--cw:rgba(var(--cyRgb),.08);--fbd:rgba(var(--cyRgb),.3)}
.t.accent{background:var(--cw);border-color:var(--fbd);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 0 12px -7px var(--cg)}
.dt.z0 .tv{color:var(--muted);text-shadow:none}
.dt.good .tv,.dt.accent .tv{color:var(--c)}
.dt .tv.bump{animation:bump .45s ease-out}
@keyframes bump{40%{transform:scale(1.16)}}
.dt .tv{transform-origin:0 60%}
.dsync{width:auto;font:inherit;color:inherit;cursor:pointer}
.dsync:active{transform:scale(.97)}
.dot{display:block;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.ss-live .dot{background:#34F0A0;box-shadow:0 0 7px rgba(52,240,160,.8)}
.ss-sync .dot,.ss-connecting .dot{background:var(--cy);box-shadow:0 0 7px rgba(var(--cyRgb),.8)}
.ss-offline .dot{background:#FFC94D;box-shadow:0 0 7px rgba(255,201,77,.7)}
.ss-error .dot{background:#FF5C7A;box-shadow:0 0 7px rgba(255,92,122,.8)}
.anim .ss-live .dot{animation:dotp 2.4s ease-in-out infinite}
.anim .ss-sync .dot,.anim .ss-connecting .dot{animation:dotp .9s ease-in-out infinite}
@keyframes dotp{50%{opacity:.35}}
.dsync.ss-live{background:rgba(52,240,160,.08);border-color:rgba(52,240,160,.34)}
.dsync.ss-offline{background:rgba(255,201,77,.08);border-color:rgba(255,201,77,.36)}
.dsync.ss-error{background:rgba(255,92,122,.1);border-color:rgba(255,92,122,.4)}
.dsync .tv{font-size:14px}
.dt .tv.x3{font-size:9.5px}
.dsync .tl{color:var(--ink2)}

#listE{padding-top:4px}
.ebar{display:flex;align-items:center;margin:12px 0 2px}
.ebar label{flex:none;margin-right:10px;font-size:14px;font-weight:800;color:var(--ink2)}
.ebar select{flex:1 1 0;min-width:0;width:100%;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line2);border-radius:13px;padding:10px 12px;min-height:44px}
.enote{margin:6px 2px 12px;font-size:11.5px;line-height:1.4;color:var(--muted)}
.ec .pbtn{padding:11px 11px 12px}
.ec .mchips{display:flex;flex-wrap:wrap;margin-top:9px}
.mc{display:inline-flex;align-items:baseline;margin:0 6px 4px 0;padding:3px 8px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap}
.mc b{margin-left:5px;font-size:13.5px;font-weight:850;color:var(--ink)}
.mc small{margin-left:1px;font-size:10.5px;font-weight:650;color:var(--muted)}
.mc.good{background:var(--cw);border-color:var(--fb)}
.mc.good b{color:var(--c)}
.mc.accent{background:var(--cw);border-color:var(--fbd)}
.mc.accent b{color:var(--cy)}
.ebody{padding:2px 10px 12px;border-top:1px solid var(--line)}
.esum{padding:12px 0 2px}
.esum .tr+.tr{margin-top:5px}
.egrp{padding-top:12px}
.egh{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 7px;font-size:13px;font-weight:800;color:var(--ink2)}
.egh small{font-size:11px;font-weight:650;color:var(--muted)}
.egrid{display:flex;flex-wrap:wrap;margin:0 -3px}
.et{width:50%;padding:0 3px 6px}
.eti{border-radius:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);padding:7px 7px 8px}
.et.has .eti{background:rgba(var(--cyRgb),.09);border-color:rgba(var(--cyRgb),.32)}
.el{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;font-size:11px;line-height:13px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.el .en{min-width:0;overflow:hidden;text-overflow:ellipsis}
.el .ex{flex:none;margin-left:5px;font-size:10px;font-weight:800;color:var(--cy)}
.ec2{display:flex;align-items:stretch}
.eb{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:11px;font-size:22px;font-weight:800;line-height:1;text-align:center;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.eb.p{color:#fff;background:linear-gradient(180deg,rgba(var(--cyRgb),.3),rgba(var(--viRgb),.22));border-color:rgba(var(--cyRgb),.55)}
.eb:active{transform:scale(.92)}
.ev{flex:1 1 0;min-width:0;width:100%;margin:0 4px;padding:0;text-align:center;font:inherit;font-size:20px;font-weight:850;color:var(--ink);background:transparent;border:0;border-bottom:2px solid rgba(255,255,255,.14);border-radius:0;font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield}
.ev:focus{border-bottom-color:var(--cy)}
.eu{flex:none;align-self:center;margin-right:2px;font-size:16px;font-weight:800;color:var(--ink2)}
.et.tl .ev{text-align:left;margin-left:2px;height:44px}

/* ortak kayıt penceresi */
.sheetw{position:fixed;left:0;right:0;top:0;bottom:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.shbg{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(3,5,14,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:relative;width:100%;max-width:560px;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,var(--card2),var(--card3));border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -14px 44px rgba(0,0,0,.55);outline:none}
.anim .sheet{animation:sheetin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetin{from{transform:translateY(46px);opacity:0}}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.shh h2{margin:0;font-size:19px;font-weight:850;letter-spacing:-.02em}
.shx{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.09);font-size:22px;line-height:1;text-align:center}
.shs{margin:0 0 12px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.shs.sm{margin:10px 0 0;font-size:12px;color:var(--muted)}
.shstat{display:flex;align-items:center;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid var(--line2);font-size:13px;color:var(--ink2)}
.shstat .dot{margin-right:9px}
.shstat b{margin-right:8px;font-size:14.5px;color:var(--ink)}
.shl{display:block;margin:14px 0 6px;font-size:12px;font-weight:750;color:var(--ink2)}
.shi{display:block;width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line2);border-radius:12px;padding:12px;min-height:46px}
.shro{padding:11px 12px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:13px;color:var(--ink);word-break:break-all}
.shb{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;margin:10px 8px 0 0;border-radius:13px;font-size:14px;font-weight:800;text-align:center;color:#06101C;background:linear-gradient(90deg,var(--cy),var(--vi))}
.shb.g{color:var(--ink);background:rgba(255,255,255,.09);border:1px solid var(--line2)}
.shb.r{color:#FF9DB0}
.shb:active{transform:scale(.97)}
.shmsg{margin-top:12px;font-size:13.5px;font-weight:700;line-height:1.45}
.shmsg.ok{color:#34F0A0}
.shmsg.er{color:#FF9DB0}
.shd{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.shd summary{font-size:14.5px;font-weight:800;color:var(--cy);padding:4px 0}
.shd ol{margin:10px 0 0;padding-left:20px;font-size:13px;line-height:1.5;color:var(--ink2)}
.shd li{margin-bottom:7px}
.shpre{display:block;margin:0;white-space:pre-wrap;word-break:break-all;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#CFE3FF;background:rgba(0,0,0,.36);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:230px;overflow:auto;-webkit-user-select:all;user-select:all}
@media (max-width:380px){
  .tab{padding:8px 10px}
  .ec .pbtn{padding:10px 9px 11px}
  .ebody{padding:2px 8px 10px}

  .ev{font-size:17px;margin:0 2px}

  .et{width:100%}
}

  .dsync .tv{font-size:17px}
  .dt .tv.x3{font-size:13px}
}

/* ---- v10: Excel sırası, yeni kutular, telefon + tablet + bilgisayar yerleşimi ---- */
:root{--hh:57px}
.top{z-index:30;padding-bottom:1px;border-bottom:0;box-shadow:none}
.top .wrap{max-width:560px}
.sidew{position:sticky;top:var(--hh);z-index:25;background:rgba(var(--bgRgb),.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line2);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.side,.mainw{max-width:560px;margin:0 auto;padding:0 14px}
body[data-tab="gir"] .top{border-bottom:1px solid var(--line2);box-shadow:0 8px 22px rgba(0,0,0,.35)}
body[data-tab="gir"] .sidew{position:static;background:none;border-bottom:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
body[data-tab="gir"] .side{padding-top:10px}
@media (max-height:520px){ .sidew{position:static} }

/* sekme düğmelerinin dokunma alanı: görünüm değişmeden 44 px'e yakın */
.tab::after{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}

/* hedefi olmayan başlık (ör. IOT hedefi boş), primli terminal, sorgu kutuları */
.t.nt{border-style:dashed;background:rgba(255,255,255,.03);box-shadow:none}
.t.nt .tv{color:var(--ink);text-shadow:none}
.t.nt .ts{color:var(--muted)}
.t.pt .tv{color:var(--ink);text-shadow:none}
.t.pt .ts{color:var(--ink2)}
.dt.nt .tv.done{color:var(--muted);font-weight:800}
.dt.qs .ts{color:var(--muted)}
.dt.qs.accent .tv{color:var(--cy)}

/* açılan ayrıntıdaki tutar listesi */
.kvs{grid-column-gap:14px}
.kv{padding:8px 0;font-size:13px}

/* Excel yükleme çubuğu (Giriş sekmesi) */
.xlbar{display:flex;align-items:center;position:relative;margin:12px 0 0;padding:10px 12px;border-radius:15px;background:rgba(var(--cyRgb),.07);border:1px solid rgba(var(--cyRgb),.28)}
.xlinfo{flex:1 1 0;min-width:0}
.xlinfo b{display:block;font-size:14px;font-weight:800}
.xlinfo span{display:block;margin-top:2px;font-size:11.5px;line-height:1.35;color:var(--ink2)}
.xlbtn{flex:none;margin-left:10px;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:13px;font-size:13.5px;font-weight:800;line-height:1.1;color:#06101C;background:linear-gradient(90deg,var(--cy),var(--vi));cursor:pointer;-webkit-tap-highlight-color:transparent}
.xlbtn svg{width:17px;height:17px;margin-right:6px;flex:none}
.xlbtn:active{transform:scale(.97)}
.xlbtn:focus-within{outline:2px solid #fff;outline-offset:2px}
.xlin{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.xlmsg{margin:8px 2px 0;font-size:12.5px;line-height:1.45}
.xlmsg:empty{display:none}

/* Giriş kartı: kapalıyken de tüm kutular görünür */

/* otomatik küçültme basamakları (tutar kutusu alt satırı) */
.txs.x1{font-size:8px;letter-spacing:-.02em;gap:2px}
.txs.x2{font-size:7.5px;letter-spacing:-.03em;gap:1px}
.txv.x3{font-size:9px;letter-spacing:-.03em}
.txs.x3{font-size:7.5px;letter-spacing:-.03em;flex-wrap:wrap;justify-content:flex-start;gap:0 3px;line-height:9px;white-space:normal}   /* en dar telefonlarda (320 px) alt satır iki satıra bölünür, kırpılmaz */
.tl.x1{letter-spacing:-.04em}
.tl.x2{font-size:7.5px;letter-spacing:-.03em}

/* uzun alan adı kesilmek yerine alt satıra insin; başlık altyazısı sekmelere çarpmasın */
.el{white-space:normal}
.el .en{white-space:normal;overflow:visible;text-overflow:clip}
.el .ex{white-space:nowrap}
.brand{min-width:0;margin-right:8px}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Gereken + Giriş: Gidişat'taki satır düzeni (5 + 5 + Aksesuar...). 3. satırda Aksesuar solda, yanında bu sekmeye özgü kutular */
.tr>.t.dt[data-k="aksesuar"]{flex:2 1 0}
.tr>.t.dt[data-k="aksesuar"]:only-child{flex:1 1 0}
.tr>.t.dt.qs{flex:1.5 1 0}
#storeG .tr>.dinfo{flex:3 1 0}

/* Giriş: toplam kutuları (Excel'deki "TOP." sütunları: Akt. adet, Akt. puan, Terminal). Durum renkleri (yeşil / camgöbeği) aynen kalır;
   toplam olduğu altın üst çizgi + altın etiket + altın çerçeveyle anlaşılır. Gereken ve Gidişat'ta durum renkleri (kırmızı/sarı/yeşil) kullanıldığı için orada yok */
.t[data-tot]{--tot:#FFD24A}
.t[data-tot]:not(.good):not(.nt){border-color:rgba(255,210,74,.4);background:linear-gradient(180deg,rgba(255,210,74,.14),rgba(255,210,74,.035) 70%),rgba(255,255,255,.045)}
.t[data-tot]>.tl{color:var(--tot)}
.t[data-tot]>.ts b{color:var(--tot)}
.t[data-tot]::after{content:"";position:absolute;z-index:2;left:6px;right:6px;top:0;height:2px;border-radius:0 0 3px 3px;background:var(--tot);box-shadow:0 0 8px rgba(255,210,74,.65);pointer-events:none}
.enote .tg{color:#FFD24A;font-weight:650}
/* Gidişat kutuları: çalışma zamanı sığdırma 3. kademeye (x3) çıkınca yazı küçülmüyordu; çok büyük yüzdelerde (ör. %1227) 320 px'te kırpılıyordu */
.tv.x3{font-size:9px;letter-spacing:-.04em}
.ec .plab{margin:0 0 0 auto;font-size:11px;font-weight:700;color:var(--cy);white-space:nowrap}
.ec.open .plab{display:none}

/* ================= app13: yeni arayüz ================= */

:root{--sbg2:var(--bg);--fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.045);--sbg:rgba(var(--bgRgb),.97);--topbg:rgba(var(--bgRgb),.97);--onacc:#06101C}
/* üst alan */
.top .trow{height:auto;min-height:50px;margin-bottom:4px}
.brand{padding:1px 0}
.brand span#donem{font-size:11.5px;line-height:14px;margin-top:1px}
.lastin{display:flex;align-items:center;margin-top:1px;font-size:11.5px;line-height:15px;color:var(--ink2);white-space:nowrap}
.lastin i{flex:none;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#34F0A0;box-shadow:0 0 7px rgba(52,240,160,.8)}
.lastin b{font-weight:800;color:var(--ink)}
.hicons{display:flex;flex:none;margin-left:8px}
.hbtn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--fill);border:1px solid var(--line2);color:var(--ink2)}
.hbtn+.hbtn{margin-left:8px}
.hbtn svg{width:21px;height:21px}
.gdot{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:#34F0A0;box-shadow:0 0 0 2px var(--ring),0 0 9px rgba(52,240,160,.85)}
.cbadge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#FF5C7A;color:#fff;font-size:11.5px;font-style:normal;font-weight:850;display:grid;place-items:center;box-shadow:0 0 0 2px var(--ring)}
.tabrow{margin:0 0 7px}
.tabrow .tabs{display:flex;width:100%}
.tabrow .tab{flex:1 1 auto;text-align:center;padding:11px 2px;font-size:12.5px;letter-spacing:-.01em}
/* başlıklar */
.gtitle{display:flex;align-items:center;margin:0 2px 9px;font-size:14.5px;font-weight:850;line-height:1.2;color:var(--ink);letter-spacing:-.01em}
.gtitle.stk{position:sticky;z-index:24;margin:0 -14px;padding:9px 16px 8px;background:var(--sbg2);border-bottom:1px solid var(--line2);box-shadow:0 8px 16px -10px rgba(0,0,0,.45)}
body[data-tab="gun"] .side{padding-top:9px}
/* Giriş: şube paneli */
#storeE.store{padding:2.5px;box-shadow:0 0 34px -4px rgba(var(--cyRgb),.6),0 0 0 1px rgba(var(--lineRgb),.22)}
#storeE .stin{padding:8px 7px 7px;background:linear-gradient(180deg,rgba(var(--cyRgb),.17),rgba(var(--viRgb),.09)),var(--card)}
.phd{position:relative;z-index:1;display:flex;align-items:center;padding:1px 2px 9px}
.phd .gdate{flex:none;margin-right:9px;padding:4px 9px;border-radius:10px;background:rgba(var(--cyRgb),.14);border:1px solid rgba(var(--cyRgb),.5);color:var(--cy);font-size:14px;font-weight:850;font-variant-numeric:tabular-nums}
.phd .ttl{flex:1 1 0;min-width:0;font-size:14.5px;font-weight:850;line-height:1.2;color:var(--ink);letter-spacing:-.01em}

.phd .shr svg{width:18px;height:18px}
/* yeni kutu düzeni: 6 + 5 + (Aksesuar | Sorgu) */
.tr.six>*+*{margin-left:3px}
.tr.six .t{padding:3px 2px 3px 4px}
.tr.six .dt .tl{font-size:8.5px;letter-spacing:-.035em}
.tr.six .tu{display:none}

.tr.six .ti svg{display:none}
.tr.six .t.good>.ti::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--cg)}
.tr.five>*+*{margin-left:4px}
.dt.pp .ts{color:var(--muted)}
.dt.pp.accent .tv{color:var(--cy)}

/* kimlik seçimi */
.who{margin:10px 0 0}

.ec.ro{margin-top:8px}
.ec.ro .pbtn{padding:10px 10px 10px;cursor:default}
.ec.ro .ebody{display:none!important}
.ec .pcoll{margin-top:8px}
.ec .lastt{flex:none;display:flex;align-items:center;font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.ec .lastt i{width:7px;height:7px;margin-right:5px;border-radius:50%;background:#34F0A0}
.ec .lastt.none{color:#FFC94D}
.ec .lastt.none i{background:#FFC94D}
.ec .phead>*+*{margin-left:8px}

.enote{margin-top:14px}
/* sade sıra rozeti */
.rk{font-size:17px;font-weight:800}

.rk.t3{color:#E6B48E;box-shadow:inset 0 0 0 1.5px rgba(230,180,142,.66)}
.pc.r1,.pc.r2,.pc.r3{border-color:var(--line);box-shadow:none;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02)),var(--card)}

.pc.r1::after{display:none}

#viewKrt{padding-top:12px}
.bhd{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 5px}
.bhd b{font-size:16px;font-weight:850;letter-spacing:-.01em;color:var(--ink)}
.bhd span{font-size:11.5px;color:var(--muted)}
.bnote{margin:0 2px 9px;font-size:12px;line-height:1.45;color:var(--ink2)}

.bgh{position:sticky;top:var(--hh,0px);z-index:24;margin:0 -14px 4px;padding:6px 14px 6px;background:var(--sbg2);border-bottom:1px solid var(--line2)}
.brow{display:grid;grid-template-columns:minmax(0,2.1fr) repeat(5,minmax(0,1fr));gap:3px;align-items:stretch}
.brow+.brow{margin-top:4px}
.bgh .brow{margin:0}
.bh{display:grid;place-items:center;min-height:26px;border-radius:9px;font-size:10.5px;font-weight:850;letter-spacing:-.01em;color:var(--onacc);background:linear-gradient(90deg,var(--cy),var(--vi))}
.bh.nm{background:none;color:var(--ink2);place-items:center start;padding-left:4px;font-weight:750}
.bn{display:flex;align-items:center;min-width:0;padding:5px 3px 5px 5px;border-radius:12px;background:var(--fill2);border:1px solid var(--line)}
.bn .rk{flex:none;width:22px;height:22px;margin-right:5px;font-size:12px}

.brow.sube .bn{background:linear-gradient(180deg,rgba(var(--cyRgb),.2),rgba(var(--viRgb),.1)),var(--card);border-color:rgba(var(--cyRgb),.6);box-shadow:0 0 18px -6px rgba(var(--cyRgb),.55)}

.bc{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:5px 2px 4px;border-radius:10px;text-align:center;background:var(--cw);border:1px solid var(--fb);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.bc .bl{display:block;font-size:8.5px;line-height:12px;color:var(--ink2);white-space:nowrap;letter-spacing:-.03em}
.bc .bl b{font-weight:850;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bc .bp{display:block;margin-top:2px;font-size:13px;line-height:16px;font-weight:850;letter-spacing:-.04em;color:var(--c);text-shadow:0 0 10px var(--cg);font-variant-numeric:tabular-nums}
.brow.sube .bc{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 14px -6px var(--cg)}
.bsep{margin:8px 2px 6px;font-size:11.5px;font-weight:750;color:var(--muted)}
.bleg{display:flex;flex-wrap:wrap;margin:12px 2px 0;font-size:11.5px;color:var(--ink2)}
.bleg span{display:flex;align-items:center;margin:0 12px 4px 0}
.bleg i{width:9px;height:9px;margin-right:5px;border-radius:3px}

.thgrid{display:flex;flex-wrap:wrap;margin:0 -3px}
.th{flex:0 0 25%;max-width:25%;padding:3px;text-align:center}
.th .sw{display:block;position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;border:1px solid var(--line2);overflow:hidden}
.th .sw i{position:absolute;display:block}

.th .sw .b{left:11%;width:36%;top:40%;bottom:14%;border-radius:6px;background:rgba(255,255,255,.22)}
.th .sw .c{left:53%;right:11%;top:40%;bottom:14%;border-radius:6px;background:rgba(255,255,255,.22)}

.th span.nm{display:block;margin-top:5px;font-size:11.5px;font-weight:750;color:var(--ink2)}
.th.on .sw{box-shadow:0 0 0 2.5px var(--cy);border-color:transparent}
.th.on span.nm{color:var(--ink);font-weight:850}
.swrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.swrow:first-of-type{border-top:0}

.swrow .tx2 span{display:block;margin-top:1px;font-size:12px;line-height:1.35;color:var(--ink2)}

.swt::after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.swt.off{background:var(--fill);border:1px solid var(--line2)}
.swt.off::after{right:auto;left:3px;background:var(--ink2);box-shadow:none}
.pcard{margin-top:12px;padding:12px;border-radius:16px;background:var(--fill2);border:1px solid var(--line2)}
.pcard .pt{display:flex;align-items:center;justify-content:space-between}
.pcard .pt b{font-size:14.5px;font-weight:850;color:var(--ink)}

.stp .sb b{display:block;font-size:16px;font-weight:850;line-height:1.25;color:var(--ink)}
.stp .sb span{display:block;margin-top:3px;font-size:13px;line-height:1.45;color:var(--ink2)}

.okline svg{width:16px;height:16px;margin-right:6px}
/* sohbet */
.chatv{position:fixed;left:0;right:0;top:0;bottom:0;z-index:70;display:flex;flex-direction:column;background:var(--bg)}

.dt .ts .w1{display:block;font-weight:600;color:var(--ink2)}
.dt .ts .w2{display:block;font-weight:800;color:var(--ink)}

/* ---- app13: ek kurallar (yeni sekmeler, başlık, tablo yerleşimi, ayarlar penceresi) ---- */

/* dar telefonlar (≤380 px): kapsayıcı kenar boşluğu 11px — yapışkan başlıkların taşması, tablo ve Kritik hücreleri */
@media (max-width:380px){
  .gtitle.stk{margin:0 -11px;padding-left:13px;padding-right:13px}
  .bgh{margin:0 -11px 4px;padding:6px 11px}
  .tbr{grid-template-columns:70px 28px repeat(12,minmax(0,1fr));column-gap:1px}

  .tbr .bd{width:15px;height:15px;font-size:9px}
  .nm{margin-left:3px}
  .nm b{font-size:9.2px}
  .nm i{font-size:8.8px}
  .tc b{font-size:9.4px;letter-spacing:-.05em}
  .tc b.l3{font-size:8.4px}
  .tc b.l4{font-size:7.2px;letter-spacing:-.07em}
  .bc .bl{font-size:8px;letter-spacing:-.045em}
  .bc .bp{font-size:12px}
  .bc .bp.l5{font-size:9.6px}
  .brow{grid-template-columns:minmax(0,1.9fr) repeat(5,minmax(0,1fr));gap:2px}
  .bn .bt b{font-size:10.5px}
}
@media (max-width:340px){
  .tbr{grid-template-columns:60px 25px repeat(12,minmax(0,1fr));column-gap:1px}
  .tbr .bd{width:13px;height:13px;font-size:8px}
  .nm b{font-size:8.4px}
  .nm i{font-size:8px}
  .tbg b{font-size:9px}
  .tc b{font-size:8.6px}
  .tc b.l3{font-size:7.8px}
  .tc b.l4{font-size:6.6px}
  .bc .bl{font-size:7.2px}
  .bc .bp{font-size:10.5px}
  .bc .bp.l5{font-size:8.4px}
  .brow{grid-template-columns:minmax(0,1.7fr) repeat(5,minmax(0,1fr))}
  .bn .bt b{font-size:9.5px}
  .bn .rk{width:18px;height:18px;margin-right:3px;font-size:10px}
}
.bc .bp.l5{font-size:10.6px;letter-spacing:-.06em}

/* tablo alt notu: dar ekranda alt satıra insin */
@media (max-width:420px){
  #tbv>.tbl{flex-wrap:wrap;row-gap:3px}
  #tbv>.tbl .lgn{white-space:normal;flex:1 1 100%}
}
@media (max-width:380px){
  .tc b.l4{font-size:7.6px}
}

body.wn2.wide .tc b{font-size:9.4px}
body.wn2.wide .tc b.l4{font-size:8px}

/* ================= app14: renk temaları ================= */
html[data-tema="okyanus"]{--bg:#05193A;--bgRgb:5,25,58;--ring:#0A2250;--card:#0C2D5E;--glow:#14468C;--card2:#103A78;--card3:#0A2450;--cy:#56CCFF;--cyRgb:86,204,255;--cyL:#A8E4FF;--vi:#6F93FF;--viRgb:111,147,255;--viL:#B4C6FF;--b1:#3F7CFF;--b2:#2455D6;--lineRgb:120,175,255}

/* ================= app15: şube sohbeti ================= */
:root{--chk0:#FF8AD0;--chk1:#FFC857;--chk2:#3CD7FF;--chk3:#34F0A0;--chk4:#B7A6FF;--chk5:#FF9A6B;--chk6:#7BE0D0;--chk7:#E6A8FF}

.hbtn[hidden]{display:none}
#btnChat[hidden]+.hbtn{margin-left:0}
.cbadge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#E8334F;color:#fff;font-size:11.5px;font-weight:850;line-height:20px;text-align:center;box-shadow:0 0 0 2px var(--bg)}

#chat,#bchat{position:fixed;left:0;right:0;top:0;height:100%;z-index:62;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
#chat[hidden],#bchat[hidden]{display:none}
.anim #chat:not([hidden]),.anim #bchat:not([hidden]){animation:chatin .28s cubic-bezier(.2,.8,.2,1)}

.ch-wrap{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;width:100%;max-width:640px;margin:0 auto}
.ch-top{flex:none;display:flex;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 10px 6px;border-bottom:1px solid var(--line2);background:var(--topbg)}
.ch-back{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink);background:none;cursor:pointer}

.ch-ti{margin-left:4px;min-width:0}
.ch-ti b{display:block;font-size:19px;font-weight:850;letter-spacing:-.02em}

.ch-list{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 12px 8px}
.ch-day{display:flex;justify-content:center;margin:16px 0 10px}

.cn{display:block;margin-bottom:2px;font-size:14.5px;font-weight:850}
.cn.k0{color:var(--chk0)}.cn.k1{color:var(--chk1)}.cn.k2{color:var(--chk2)}.cn.k3{color:var(--chk3)}.cn.k4{color:var(--chk4)}.cn.k5{color:var(--chk5)}.cn.k6{color:var(--chk6)}.cn.k7{color:var(--chk7)}
.cx{display:block;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.ct{display:block;margin-top:3px;text-align:right;font-size:12px;color:var(--muted)}
.cm.own .ct{color:inherit;opacity:.7}
.ch-empty,.ch-old{margin:28px 16px;text-align:center;font-size:14px;color:var(--ink2)}
.ch-old{margin:8px 0 4px;font-size:13px}
.ch-oldb{display:block;margin:6px auto 4px;min-height:40px;padding:0 16px;border-radius:999px;background:var(--fill);border:1px solid var(--line2);font-size:13.5px;font-weight:750;color:var(--ink2);cursor:pointer}
.ch-msg{flex:none;margin:0 12px 6px;font-size:13.5px;font-weight:700;line-height:1.45}
.ch-msg:empty{display:none}
.ch-msg.er{color:#FF9DB0}
.ch-msg.ok{color:#34F0A0}
.ch-lnk{display:inline;min-height:0;padding:0;font:inherit;font-weight:850;color:var(--cy);text-decoration:underline;text-underline-offset:3px;background:none;cursor:pointer}
.ch-foot{flex:none;padding:6px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);background:var(--topbg)}
.ch-as{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:14px;color:var(--ink2)}
.ch-as b{color:var(--ink);font-weight:850}

.ch-as.todo .ch-ast{color:var(--cy);font-weight:800}
.ch-as select{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.ch-in{display:flex;align-items:flex-end;margin-top:4px}
.ch-in textarea{flex:1 1 0;min-width:0;display:block;resize:none;font:inherit;font-size:16px;line-height:1.35;color:var(--ink);background:var(--fill);border:1px solid var(--line2);border-radius:24px;padding:11px 16px;min-height:48px;max-height:120px;overflow-y:auto}

.ch-send{flex:none;display:grid;place-items:center;width:48px;height:48px;margin-left:8px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--vi));color:var(--onacc);cursor:pointer}

.ch-note{margin:7px 4px 0;font-size:12.5px;color:var(--muted)}
.ch-back:focus-visible,.ch-send:focus-visible,.ch-oldb:focus-visible,.ch-lnk:focus-visible,.ch-in textarea:focus-visible{outline:2px solid var(--cy);outline-offset:2px}

html[data-theme="light"] .cm .cb{background:#fff;border-color:var(--line)}

html[data-theme="light"] .ch-msg.ok{color:#077A50}

.hb-pth.f svg{width:26px;height:26px}
.hb-pth.f em{margin-top:3px;font-size:12px;font-style:normal;font-weight:850}
.hb-px{flex:1 1 auto;min-width:0}
.hb-px b{display:block;font-size:16.5px;font-weight:850;line-height:1.3;word-break:break-word;overflow-wrap:anywhere}
.hb-pn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;font-size:14px;line-height:1.35;color:var(--ink2);word-break:break-word;overflow-wrap:anywhere}
.hb-px i{display:block;margin-top:4px;font-size:12.5px;font-style:normal;color:var(--muted)}

.hb-rm{flex:none;align-self:flex-start;display:grid;place-items:center;width:44px;height:44px;margin:2px 2px 0 0;padding:0;background:none;border:0;border-radius:50%;color:var(--muted);cursor:pointer}
.hb-rm svg{width:17px;height:17px}
.hb-sheet{position:absolute;left:0;right:0;top:0;bottom:0;z-index:3;display:flex;align-items:flex-end;justify-content:center}
.hb-sheet[hidden]{display:none}
.anim .hb-sheet:not([hidden]) .cxs-p{animation:chatin .22s cubic-bezier(.2,.8,.2,1)}
.hb-sh{margin:2px 4px 2px;font-size:19px;font-weight:850;letter-spacing:-.02em}
.hb-lb{display:block;margin:8px 4px 4px;font-size:13.5px;font-weight:800;color:var(--ink2)}
.hb-in{display:block;width:100%;box-sizing:border-box;margin:0 0 6px;padding:11px 13px;border-radius:13px;background:var(--fill);border:1px solid var(--line2);color:var(--ink);font:inherit;font-size:16px;line-height:1.35;resize:none}
.hb-in:focus{outline:2px solid var(--cy);outline-offset:1px}
.hb-at{display:flex;flex-direction:column;margin:8px 0 2px}
.hb-pub{justify-content:center;background:linear-gradient(135deg,var(--cy),var(--vi));border-color:transparent;color:var(--onacc);font-weight:850}
.hb-pub:disabled{opacity:.55}
.hb-pub span{text-align:center}
.cxs-b.g span:not(.cxs-i),.cxs-b.er span:not(.cxs-i){width:100%;text-align:center}
.hb-rd{padding:22px 18px;color:#fff;text-align:left}

.hb-vn i{display:block;margin-top:6px;font-size:13px;font-style:normal;opacity:.75}
.cxv-body .hb-vn{margin:10px 16px 16px}

  for (var i = 0; i < n * 2; i++){ var a = -Math.PI / 2 + i * Math.PI / n, r = i % 2 ? r2 : r1; o.push((cx + r * Math.cos(a)).toFixed(2) + ',' + (cy + r * Math.sin(a)).toFixed(2)); }
  return o.join(' ');
}
var GOLD_PTS = ptsStar(32, 44, 12, 23, 19), HEX_PTS = '';
(function(){ var o = []; for (var i = 0; i < 6; i++){ var a = -Math.PI / 2 + i * Math.PI / 3; o.push((32 + 22 * Math.cos(a)).toFixed(2) + ',' + (44 + 22 * Math.sin(a)).toFixed(2)); } HEX_PTS = o.join(' '); })();
var SPK = 'M0,-6.5L1.7,-1.7L6.5,0L1.7,1.7L0,6.5L-1.7,1.7L-6.5,0L-1.7,-1.7Z';
function lg(id, st){ return '<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' + st.map(function(s){ return '<stop offset="' + s[0] + '" stop-color="' + s[1] + '"/>'; }).join('') + '</linearGradient>'; }
function defsHTML(){
  return '<defs>'
    + lg('g-gold', [['0', '#FFF3B0'], ['.35', '#FFD24A'], ['.72', '#E8A317'], ['1', '#B7740A']])
    + lg('g-silver', [['0', '#FFFFFF'], ['.35', '#DCE4F5'], ['.75', '#9AA7C2'], ['1', '#6E7B97']])
    + lg('g-bronze', [['0', '#FFE0C2'], ['.4', '#E59A5C'], ['.75', '#B8672B'], ['1', '#7F4217']])
    + '<clipPath id="cp-gold"><polygon points="' + GOLD_PTS + '"/></clipPath>'
    + '<clipPath id="cp-silver"><circle cx="32" cy="44" r="21"/></clipPath>'
    + '<clipPath id="cp-bronze"><polygon points="' + HEX_PTS + '"/></clipPath></defs>';
}
function medal(rank){
  var t = rank === 1 ? 'gold' : (rank === 2 ? 'silver' : 'bronze');
  var shape = rank === 1 ? '<polygon points="' + GOLD_PTS + '" fill="url(#g-gold)"/>'
    : (rank === 2 ? '<circle cx="32" cy="44" r="21" fill="url(#g-silver)"/>' : '<polygon points="' + HEX_PTS + '" fill="url(#g-bronze)"/>');
  return '<svg class="medal ' + t + '" viewBox="0 0 64 70" aria-hidden="true" focusable="false">'

    + shape
    + '<g clip-path="url(#cp-' + t + ')"><g transform="rotate(24 32 44)"><rect class="shine" x="2" y="12" width="9" height="64"/></g></g>'
    + '<circle cx="32" cy="44" r="15.5" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/>'

    + '<g transform="translate(8,24)"><path class="sp s1" d="' + SPK + '"/></g>'
    + '<g transform="translate(57,29)"><path class="sp s2" d="' + SPK + '"/></g>'

function setBadge(w, rank, frac){

/* ---------- kutu dolumu, çubuklar ve sayaçlar ---------- */
function pctW(v){ return Math.max(0, Math.min(130, v)) / 130 * 100; }
function setW(f, w){ f.setAttribute('data-w', w); f.style.width = w + '%'; }
function vis(e){ return e.getClientRects().length > 0; }
function playBars(root){
  var fls = $$('.fl[data-w]', root).filter(vis);
  if (!anim){ fls.forEach(function(f){ f.style.transitionDelay = '0ms'; f.style.width = f.getAttribute('data-w') + '%'; }); return; }
  fls.forEach(function(f){ f.style.transition = 'none'; f.style.transitionDelay = '0ms'; f.style.width = '0%'; });
  void root.offsetWidth;
  fls.forEach(function(f, n){ f.style.transition = ''; f.style.transitionDelay = (Math.min(n, 14) * 25) + 'ms'; f.style.width = f.getAttribute('data-w') + '%'; });
}
function playFills(root){
  var fs = $$('.fill[data-s]', root).filter(vis);
  if (!anim){ fs.forEach(function(f){ f.style.transitionDelay = '0ms'; f.style.transform = 'scaleY(' + f.getAttribute('data-s') + ')'; }); return; }
  fs.forEach(function(f){ f.style.transition = 'none'; f.style.transitionDelay = '0ms'; f.style.transform = 'scaleY(0)'; });
  void root.offsetWidth;
  fs.forEach(function(f, n){ f.style.transition = ''; f.style.transitionDelay = (Math.min(n, 40) * 16) + 'ms'; f.style.transform = 'scaleY(' + f.getAttribute('data-s') + ')'; });
}
function runCount(e){
  var fin = e.getAttribute('data-final'), n = parseFloat(e.getAttribute('data-n')), f = e.getAttribute('data-f');
  if (e._raf) cancelAnimationFrame(e._raf);
  if (!anim || !(n >= 0) || !window.requestAnimationFrame){ e.textContent = fin; return; }
  function fmt(v){
    if (f === 'tl') return '₺' + fInt(v);
    if (f === 'int') return fInt(v);
    if (f === 'pct1') return '%' + (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');
    if (f === 'dec2') return (Math.round(v * 100) / 100).toFixed(2).replace('.', ',');
    return '%' + Math.round(v);
  }
  var t0 = null, dur = 750;
  function step(ts){
    if (t0 === null) t0 = ts;
    var k = Math.min(1, (ts - t0) / dur), ease = 1 - Math.pow(1 - k, 3);
    if (k < 1){ e.textContent = fmt(n * ease); e._raf = requestAnimationFrame(step); } else { e.textContent = fin; e._raf = 0; }
  }
  e.textContent = fmt(0); e._raf = requestAnimationFrame(step);
}
function playCounts(root){ $$('.cu[data-final]', root).filter(vis).forEach(runCount); }
function playRings(root){
  var rs = $$('.rf[data-r]', root).filter(vis);
  function fin(f){ return 100 - 100 * Math.max(0, Math.min(1, parseFloat(f.getAttribute('data-r')))); }
  if (!anim){ rs.forEach(function(f){ f.style.strokeDashoffset = fin(f); }); return; }
  rs.forEach(function(f){ f.style.transition = 'none'; f.style.transitionDelay = '0ms'; f.style.strokeDashoffset = 100; });
  void root.offsetWidth;
  rs.forEach(function(f, n){ f.style.transition = ''; f.style.transitionDelay = (Math.min(n, 10) * 60) + 'ms'; f.style.strokeDashoffset = fin(f); });
}
function playIn(root){ playBars(root); playFills(root); playRings(root); playCounts(root); }
function setCu(e, text, n, f){ e.textContent = text; e.setAttribute('data-final', text); e.setAttribute('data-n', n); e.setAttribute('data-f', f); }
function applyAnim(){ document.documentElement.classList.toggle('anim', anim); }

/* ---------- kartlar ---------- */
var CARDS = [];
function buildCard(o, idx, store){
  var root = el('div', 'pc stg' + (store ? ' sc' : ''));
  root.setAttribute('data-i', store ? 's' : idx);
  var marq = el('div', 'marq'); marq.setAttribute('aria-hidden', 'true');
  var btn = el('button', 'pbtn', '<span class="phead"><span class="bdg"></span><span class="pname">' + esc(store ? 'Şube toplamı' : o.adT) + '</span><span class="psc"><span class="pscore cu"></span><span class="plab">Genel</span></span>' + IC.chev + '</span><span class="pcoll">' + tilesHTML(o, false) + '</span>');
  btn.type = 'button'; btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-controls', 'pb-' + (store ? 's' : idx));
  var body = detailBody(o); body.id = 'pb-' + (store ? 's' : idx); body.hidden = true;
  root.appendChild(marq); root.appendChild(btn); root.appendChild(body);
  var c = { root:root, btn:btn, body:body, bdg:$('.bdg', btn), score:$('.pscore', btn) };
  var g = score(o, ALL);
  setCu(c.score, fg(g), g.n ? g.S / g.n : 0, 'pct1');
  btn.addEventListener('click', function(){ setOpen(c, btn.getAttribute('aria-expanded') !== 'true'); });
  return c;
}
function allOpen(){ return CARDS.every(function(c){ return c.root.classList.contains('open'); }); }
function setOpen(c, open){
  c.root.classList.toggle('open', open);
  c.btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  c.body.hidden = !open;
  if (open) playIn(c.body);
  $('#btnAll').textContent = allOpen() ? 'Tümünü kapat' : 'Tümünü aç';
}
function buildList(){
  var list = $('#list');
  var gi = rankBy(function(q){ var g = score(q, ALL); return [g.n ? g.S / g.n : 0, g.c.good]; });
  var made = V.kisiler.map(function(p, i){ return buildCard(p, i, false); });
  gi.forEach(function(o, pos){
    var p = V.kisiler[o.i], c = made[o.i], g = score(p, ALL);
    setBadge(c.bdg, o.rank, g.n ? g.S / g.n / 100 : 0);
    if (o.rank >= 1 && o.rank <= 3) c.root.classList.add('r' + o.rank);
    c.root.style.setProperty('--i', Math.min(pos + 1, 10));
    c.btn.setAttribute('aria-label', o.rank + '. sıra, ' + p.adT + ', genel ' + fg(g) + '. Ayrıntılar için dokunun.');
    list.appendChild(c.root); CARDS.push(c);
  });
  var sc = buildCard(V.sube, V.kisiler.length, true);
  var sg = score(V.sube, ALL);
  sc.bdg.innerHTML = ringHTML(sg.n ? sg.S / sg.n / 100 : 0) + '<span class="rk sico" aria-hidden="true">' + IC.mag + '</span>';
  sc.root.style.setProperty('--i', 10);
  sc.btn.setAttribute('aria-label', 'Şube toplamı, genel ' + fg(sg) + '. Ayrıntılar için dokunun.');
  list.appendChild(sc.root); CARDS.push(sc);
  return gi;
}

function dTile(k, o){
  var g = o.dg[k], m = o.m[k];
  if (m.nt) return '<span class="t dt nt" data-k="' + k + '" role="img" aria-label="' + esc(DLB[k] + ': hedef yok') + '"><span class="tl">' + esc(DLB[k]) + '</span><span class="tvr"><b class="tv done">–</b></span><span class="ts">hedef yok</span></span>';
  var s = stOf(k, m), sc = Math.min(1, Math.max(0, pv(k, m) / 100));
  var f = g.u === 'tl' ? 'tl' : 'int', unit = g.u === 'adet' ? 'adet' : (g.u === 'puan' ? 'puan' : '');
  var dy = M.bugun.kalanGun > 0 ? M.bugun.kalanGun : 1, far = !g.z && g.d === 0 && g.k > 0, gg = far ? gcd(g.k, dy) : 1;

/* ----- saklama: bu cihaz -----

function cleanOne(src){

    GF.forEach(function(a){ var v = cleanVal(a.k, src[a.k]); if (v){ o[a.k] = v; n++; } });

}

    Object.keys(raw).forEach(function(r){ if (/^\d{1,9}$/.test(r)){ o = cleanOne(raw[r]); if (o) E.loc[r] = o; } });
  } else {

  }

function cleanPend(q){

function parseToken(s){

  var m = /^GK1~([a-zA-Z0-9.-]+)~([a-z0-9]{20,64})$/.exec(s), u;

  if (DEFAULT_DB && /^[a-z0-9]{20,64}$/.test(s)) return { u:DEFAULT_DB, k:s };                         /* kısa biçim: yalnızca mağaza kodu */

function hh(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function dtxt(e, sel){
  var x = sel ? e.querySelector(sel) : e, f, c, cu, i;
  if (!x) return '';
  f = x.getAttribute('data-final');
  if (f != null) return String(f).replace(/\s+/g, ' ').replace(/^ | $/g, '');
  c = x.cloneNode(true); cu = c.querySelectorAll('.cu[data-final]');
  for (i = 0; i < cu.length; i++) cu[i].textContent = cu[i].getAttribute('data-final');
  return String(c.textContent).replace(/\s+/g, ' ').replace(/^ | $/g, '');
}
function stOfEl(e){ return e.classList.contains('good') ? 'good' : (e.classList.contains('warn') ? 'warn' : (e.classList.contains('bad') ? 'bad' : '')); }

/* sabit şube paneli: Kritik Başlıklar sekmesinde ve Gidişat tablosunda yoktur; Gereken sekmesinde başlıkları vardır */

/* Mağaza ikonu: link "…?gk=KOD&s=ad-kodu" ise ana ekran ikonu ve adı o mağazanınkidir.
   İkon dosyaları sayfanın yanında durur (icon-ad-kodu.png); ad/dosya tablosu derlemede yazılır (gizli bir şey içermez). */

function ntfySend(title, msg, cb, beacon, topic){

  if (k !== 'otomatik' && !temaVar(k)) return;
  PF.tema = k; prefSave();
  if (window.__gkTema) window.__gkTema(k);
  pwaUpdate();
  $$('#sheet .th').forEach(function(b){ var on = b.getAttribute('data-k') === k; b.className = b.className.replace(/\s*\bon\b/g, '') + (on ? ' on' : ''); b.setAttribute('aria-checked', on ? 'true' : 'false'); });
}
function toggleSw(k, b){
  if (k !== 'bil' && k !== 'ses' && k !== 'tit') return;
  PF[k] = !PF[k]; prefSave();
  b.setAttribute('aria-checked', PF[k] ? 'true' : 'false');
  var s = $('.swt', b); if (s) s.className = 'swt' + (PF[k] ? '' : ' off');
  if (PF[k] && k === 'ses'){ audioUnlock(); chime(); }                         /* açarken bir örnek çalar */
  if (PF[k] && k === 'tit') buzz();
}
function prefAct(act, b){
  var k = b.getAttribute('data-k'), tp;
  if (act === 'tema'){ setTema(k); return true; }
  if (act === 'sw'){ toggleSw(k, b); return true; }
  if (act === 'ntf'){ openNtfy(); return true; }
  if (act === 'pushon'){ pushEnable(); return true; }
  if (act === 'pushoff'){ pushOff(function(){ pushUi(); pushMsg('Kapatıldı. Bu telefona artık bildirim gelmez.', true); }); return true; }
  if (act === 'pushtest'){ pushTest(); return true; }
  if (act === 'ntfcopy'){ copyText(ntfyTopic(), function(ok){ sheetMsg(ok ? 'Konu adı kopyalandı. ntfy uygulamasında + işaretine basıp yapıştır.' : 'Kopyalanamadı. Yukarıdaki yazıyı elle seç.', ok); }); return true; }
  if (act === 'ntfadd'){
    tp = ntfyTopic();
    if (/Android/i.test(navigator.userAgent || '')){ try { window.location.href = 'ntfy://ntfy.sh/' + tp; } catch(e){} sheetMsg('ntfy açılmazsa önce uygulamayı kur, sonra tekrar dokun.', true); }
    else copyText(tp, function(ok){ sheetMsg(ok ? 'Konu adı kopyalandı. ntfy uygulamasında + işaretine basıp yapıştır.' : 'Kopyalanamadı. Yukarıdaki yazıyı elle seç.', ok); });
    return true;
  }
  if (act === 'ntftest'){
    sheetMsg('Gönderiliyor…', true);
    ntfySend(ntfyName(), 'Deneme bildirimi: ses ve titreşimle geldiyse hazırsın.', function(ok){
      var okl = $('#ntfOk');
      if (!ok){ if (okl) okl.hidden = true; sheetMsg('Gönderilemedi. İnternet bağlantını kontrol edip tekrar dene.', false); return; }
      PF.ntfy = true; prefSave();                      /* yalnızca "bu telefonda kurulum denendi" işareti; göndermeyi etkilemez */
      if (okl) okl.hidden = false;
      sheetMsg('', true);
    });
    return true;
  }
  return false;
}
function prefInit(){
  var f, mq;
  E.nb = {}; E.np = {};
  prefLoad();
  if (window.__gkTema) window.__gkTema(PF.tema);
  try {
    mq = window.matchMedia('(prefers-color-scheme: light)');
    f = function(){ if (PF.tema === 'otomatik'){ if (window.__gkTema) window.__gkTema('otomatik'); pwaUpdate(); } };
    if (mq.addEventListener) mq.addEventListener('change', f); else if (mq.addListener) mq.addListener(f);
  } catch(e){}
  document.addEventListener('touchend', audioUnlock, true);
  document.addEventListener('click', audioUnlock, true);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) ntfyFlush(true); });
  window.addEventListener('pagehide', function(){ ntfyFlush(true); });
}

/* ================= app18: sohbet eklentileri =================
   Fotoğraf / dosya eki, profil fotoğrafı, okundu bilgisi, mesajı düzeltme ve geri alma.
   Şube sohbeti (js_chat.js) ile Bölge yazışması (js_bchat.js) AYNI kodu kullanır. Her konuşma iki nesneyle çalışır:
     th = konuşma kaydı (map, pend, lastT, ready … + burada tembelce eklenen alanlar)   ev = konuşmanın "ortamı" (kimlik, adres, yeniden çiz …).
   Protokol (hepsi sohbet düğümünde c/<kimlik>; eski sürümler fazla alanları yok sayar, düzeltme/geri alma kaydını sıradan mesaj gibi gösterir):
     c/<id> = { t, n, m }                      sıradan mesaj
            + { r: <asıl id> }                 düzeltme (m = yeni metin)
            + { r, x: 1 }                      geri alma (asıl mesaj ve eki silinir; bu kayıt "geri aldı" satırı olarak kalır)
            + { a, at: 'i'|'f', an, as, th }   ek: p/<a> = { t, d: base64, y: tür }; th = küçük resim (yalnız fotoğraf)
     rd/<kişi> = { t, u, n }                   okundu: u = bu kişinin gördüğü en son mesajın saati
     av/<kişi> = { t, d, n }                   profil fotoğrafı (d: küçük JPEG ya da "-" = kaldırıldı)
   Kişi anahtarı: r<kişi numarası> (çalışan) ya da m (bölge müdürü).
   Hepsi th.cx === true olunca açılır (av düğümüne dizinli sorgu 200 dönerse = yeni kurallar yapıştırılmış); değilse eski sohbet aynen çalışır.
   Ekler 10 gün sonra silinir (herhangi bir cihaz sohbeti açınca süpürür); mesajın metni kalır. */
var CX_ID = /^[0-9a-z]{10,40}$/, CX_KEY = /^(r[0-9]{4,9}|m)$/, CX_JPG = /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;

}

function cxFname(n, def){
  var s = String(n || '').replace(/^.*[\\\/]/, '').replace(/[\u0000-\u001f]+/g, ' ').replace(/^\s+|\s+$/g, ''), i, ext;

/* ----- kayıt doğrulama (sunucudan ve telefondan gelen) ve gönderim gövdesi ----- */
function chOk(id, o){
  var r;
  if (!/^[0-9a-z]{10,40}$/.test(id) || !o || typeof o !== 'object') return null;
  if (typeof o.t !== 'number' || !isFinite(o.t) || typeof o.n !== 'string' || typeof o.m !== 'string') return null;
  if (!o.n || o.n.length > 40 || !o.m || o.m.length > CH_MAX) return null;
  r = { id:id, t:o.t, n:o.n, m:o.m };
  if (o.r != null){
    if (typeof o.r !== 'string' || !CX_ID.test(o.r)) return null;
    r.r = o.r; if (o.x === 1) r.x = 1;
  }
  if (o.a != null){
    if (typeof o.a !== 'string' || !CX_ID.test(o.a) || (o.at !== 'i' && o.at !== 'f') || typeof o.an !== 'string' || !o.an || o.an.length > 80 || typeof o.as !== 'number' || !isFinite(o.as) || o.as < 0) return null;
    r.a = o.a; r.at = o.at; r.an = o.an; r.as = o.as;
    if (typeof o.th === 'string' && o.th.length >= 20 && o.th.length <= 12000 && CX_JPG.test(o.th)) r.th = o.th;
  }
  return r;
}
function cxBody(o){
  var b = '{"t":{".sv":"timestamp"},"n":' + JSON.stringify(o.n) + ',"m":' + JSON.stringify(o.m);
  if (o.r){ b += ',"r":' + JSON.stringify(o.r); if (o.x) b += ',"x":1'; }
  if (o.a){ b += ',"a":' + JSON.stringify(o.a) + ',"at":' + JSON.stringify(o.at) + ',"an":' + JSON.stringify(o.an) + ',"as":' + Math.floor(o.as); if (o.th) b += ',"th":' + JSON.stringify(o.th); }
  return b + '}';
}

/* ----- düzeltme ve geri alma: kayıt listesinden ekranda görünecek mesajlar ----- */
function cxView(a){
  var ed = {}, rt = {}, out = [], i, m, o;
  for (i = 0; i < a.length; i++){
    m = a[i];
    if (!m.r) continue;
    if (m.x) rt[m.r] = m; else if (!ed[m.r] || m.t >= ed[m.r].t) ed[m.r] = m;
  }
  for (i = 0; i < a.length; i++){
    m = a[i];
    if (m.r){ if (m.x) out.push({ id:m.id, t:m.t, n:m.n, tomb:true, wait:m.wait, fail:m.fail }); continue; }
    if (rt[m.id] && rt[m.id].n === m.n) continue;                              /* geri alınmış */
    o = m;
    if (ed[m.id] && ed[m.id].n === m.n){ o = cxCopy(m); o.m = ed[m.id].m; o.ed = true; }   /* yalnızca kendi mesajını düzeltebilir */
    out.push(o);
  }
  return out;
}

function cxMsgs(ev, a){
  var th = ev.th(), v = cxView(a), me = ev.me(), h = '', last = '', pn = '', pt = 0, i, m, own, d, dt, sn;
  for (i = 0; i < v.length; i++){
    m = v[i]; d = chDay(m.t); dt = new Date(m.t);
    if (d !== last){ h += '<div class="ch-day"><span>' + esc(d) + '</span></div>'; last = d; pn = ''; }
    own = !!me && m.n === me;
    if (m.tomb){
      h += '<div class="cm tomb' + (m.wait ? ' wait' : '') + '"><span>' + esc(own ? 'Bir mesajı geri aldın' : m.n + ' bir mesajı geri aldı') + '</span></div>';
      pn = ''; continue;
    }
    sn = !own && (m.n !== pn || m.t - pt > 300000);
    h += '<div class="cm' + (own ? ' own' : '') + (m.wait ? ' wait' : '') + (m.a ? ' att' : '') + '" data-mid="' + m.id + '">'
      + (own ? '' : cxAv(th, m.n, sn))
      + '<div class="cb">' + (sn ? '<span class="cn k' + chHue(m.n) + '">' + esc(m.n) + '</span>' : '')
      + cxAttHTML(m) + (cxShowText(m) ? '<span class="cx">' + esc(m.m) + '</span>' : '')
      + '<span class="ct">' + pad2(dt.getHours()) + ':' + pad2(dt.getMinutes()) + (m.ed ? ' · düzenlendi' : '')
      + (m.wait ? (m.fail ? ' · gitmedi, bağlanınca gider' : ' · gönderiliyor') : (own ? cxTicks(ev, m) : '')) + '</span></div></div>';
    pn = m.n; pt = m.t;
  }
  return h;

/* ----- fotoğraf / dosya hazırlama ----- */
function cxLoadImg(file, cb){
  var url, im = new Image(), done = false, U = window.URL || window.webkitURL;
  function fin(e, i){ if (done) return; done = true; try { if (url && U) U.revokeObjectURL(url); } catch(x){} cb(e, i); }
  try { url = U.createObjectURL(file); } catch(e){ fin('x'); return; }
  im.onload = function(){ fin(null, im); };
  im.onerror = function(){ fin('x'); };
  im.src = url;
}
function cxDraw(im, edge, q, square){
  var w = im.naturalWidth || im.width, h = im.naturalHeight || im.height, s, cw, ch, sx = 0, sy = 0, sw = w, sh = h, c, g;
  if (!(w > 0 && h > 0)) return '';
  if (square){ s = Math.min(w, h); sx = Math.floor((w - s) / 2); sy = Math.floor((h - s) / 2); sw = s; sh = s; cw = edge; ch = edge; }
  else { s = Math.min(1, edge / Math.max(w, h)); cw = Math.max(1, Math.round(w * s)); ch = Math.max(1, Math.round(h * s)); }
  c = document.createElement('canvas'); c.width = cw; c.height = ch; g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cw, ch);
  g.drawImage(im, sx, sy, sw, sh, 0, 0, cw, ch);
  try { return c.toDataURL('image/jpeg', q); } catch(e){ return ''; }
}
function cxThumb(im){                                                          /* ≤ 10500 karakter (kural 12000) */
  var edge = 176, q = 0.55, d = '', n;
  for (n = 0; n < 8; n++){
    d = cxDraw(im, edge, q, false);
    if (d && d.length <= 10500) return d;
    if (q > 0.34) q -= 0.07; else edge = Math.round(edge * 0.8);
  }
  return d && d.length <= 11500 ? d : '';
}
function cxPhoto(im, lim, edges){                                              /* tam boy ≤ ~750 KB (varsayılan); yayınlar için sınır ve kenar listesi verilir */
  var qs = [0.72, 0.62, 0.52], i, j, d, t;
  edges = edges || [1280, 1024, 800, 640]; lim = lim || CX_FULL_CH;
  for (i = 0; i < edges.length; i++) for (j = 0; j < qs.length; j++){
    d = cxDraw(im, edges[i], qs[j], false);
    if (d && d.length <= lim){
      t = cxThumb(im);
      if (!t) return null;
      return { d:d.slice(d.indexOf(',') + 1), th:t };
    }
  }
  return null;
}

      if (j && typeof j === 'object') for (k in j) if (j.hasOwnProperty(k) && CX_KEY.test(k)){
        r = j[k];
        if (!r || typeof r.t !== 'number' || typeof r.n !== 'string' || typeof r.d !== 'string' || !r.n || r.n.length > 40) continue;
        if (r.t > th.avT) th.avT = r.t;
        if (r.d.length <= 20000 && CX_JPG.test(r.d)) th.avm[r.n] = r.d; else delete th.avm[r.n];
        ch = true;

  });
}

function pushPost(method, body, cb){

/* Konular (ntfy). Hepsi mağaza kodundan türer; kodun kendisi dışarı çıkmaz.

     Yukarı  (tpUp):   şube → müdür (sohbet). YALNIZCA müdürün telefonu dinler.

function tpDown(code){ return tpHash('gk-down:' + code); }
function tpFrom(code, name){ return tpHash('gk-from:' + code + '\n' + name); }
function tpNamed(){ return !!E.cfg && NP > 0 && NP <= PUSH_NAMES; }          /* şube küçükse sohbet bildirimi yazana göre ayrılır; değilse eski yol (şube konusu) */
function pushPeers(){                                                         /* bu cihazın dinleyeceği "yazan" konuları: kendi adı hariç herkes */
  var t = [], me = chMe(), i, nm, tp, seen = {};
  if (!tpNamed()) return t;
  for (i = 0; i < NP; i++){
    nm = V.kisiler[i] ? V.kisiler[i].adT : '';
    if (!nm || nm === me) continue;
    tp = tpFrom(E.cfg.k, nm);

function pushReady(){ return BG.on ? BG.list.some(function(x){ return !!x.k; }) : !!E.cfg; }

  var t = [], tp, peers;

   Bu konuyu YALNIZCA şube cihazları dinler; müdürün kendi telefonu dinlemez, bu yüzden kendi mesajının bildirimi kendine düşmez.
   Bildirimde mesajın kendisi YOKTUR (ntfy üçüncü taraf sunucudur); içerik yalnızca şubenin ortak kaydında durur.
   Bildirim, şube telefonunda bildirim açıksa uygulama kapalıyken de görünür. Gidişatlar ve Bugün sekmeleri yalnızca okur;
   ortak kayda yazılan TEK şey sohbet mesajıdır (bu sekme ve «Yazışmalar», js_bchat.js).
   Kural: sohbet düğümü (c) Firebase kurallarında vardır; yoksa yazma reddedilir ve ekranda tek seferlik ayar yönergesi çıkar. */
var BM = { to:null, name:'Bölge Müdürü', confirm:false, busy:false, res:null, hist:[], rules:false, rulesNew:false, probeAt:0, probing:false, edit:false, sig:'', loaded:false };

  if (!o || typeof o !== 'object' || !/^[0-9a-z]{10,40}$/.test(o.id) || typeof o.t !== 'number' || !isFinite(o.t)) return null;
  if (typeof o.m !== 'string' || !o.m || o.m.length > BM_MAX || typeof o.n !== 'string' || !o.n || o.n.length > 40) return null;
