lass=\"cnt\">\u015eube say\u0131lar\u0131: '+D.sy.map(r=>r.ad.split(' ')[0]+' '+r.n).join(' \u00b7 ')+'\u003c/div>';\n h+='\u003cdiv class=\"notes\">'+D.notlar.map(n=>'\u003cp>'+esc(n)+'\u003c/p>').join('')+'\u003c/div>';\n app.innerHTML=h;\n}\n\nfunction stat(m,v){ // 2: hedefte, 1: yak\u0131n (%85-100), 0: hedef alt\u0131\n if(typeof v!=='number')return -1;\n if(m.th)return v>=m.th[1]?2:v>=m.th[0]?1:0;\n return v>=m.min?2:0;\n}\nfunction esik(m){\n if(m.th)return 'Hedef: gidi\u015fat \u2265 %100';\n if(m.k==='egyg')return 'Hedef: \u2265 '+(D.gun/2).toLocaleString('tr-TR')+' adet';\n if(m.k==='mma')return 'Hedef: \u2265 4,60';\n return 'Hedef: \u2265 %'+(m.min*100).toLocaleString('tr-TR');\n}\nfunction grp(r){\n const g=[[],[],[]];\n D.subeler.forEach(s=>{const t=stat(r.m,s.v[r.j]);if(t>=0)g[t].push(s)});\n const two=!r.m.th;\n const mk=(arr,cl,title,asc)=>{if(!arr.length)return '';arr=arr.slice().sort((a,b)=>a.kod\u003cb.kod?-1:a.kod>b.kod?1:0);\n  return '\u003cdiv class=\"gh '+cl+'\">'+title+' ('+arr.length+')\u003c/div>\u003cdiv class=\"gl\">'+arr.map(s=>'\u003cspan class=\"c2 '+cl+'\">'+esc(s.ad)+' \u003cb>'+fmt(r.m,s.v[r.j])+'\u003c/b>\u003c/span>').join('')+'\u003c/div>'};\n return mk(g[2],'g','Hedefte',false)+(two?'':mk(g[1],'a','%85\u2013100 (hedefe yak\u0131n)',false))+mk(g[0],'r',two?'Hedef alt\u0131':'%85 alt\u0131',true);\n}\nfunction viewAnaliz(){\n const N=D.subeler.length;\n const R=M.map((m,j)=>{\n  const c=[0,0,0];D.subeler.forEach(s=>{const t=stat(m,s.v[j]);if(t>=0)c[t]++});\n  const sorted=D.subeler.filter(s=>typeof s.v[j]==='number').slice().sort((a,b)=>a.v[j]-b.v[j]);\n  return {m,j,c,low:sorted.slice(0,3),top:sorted.slice(-3).reverse()};\n });\n const byPass=R.slice().sort((a,b)=>b.c[2]-a.c[2]);\n const best=byPass[0],worst=byPass[byPass.length-1];\n const weak=R.filter(r=>r.c[2]*3\u003cN).map(r=>r.m.a);\n const sys=[...new Set(D.subeler.map(s=>s.sy))].map(sy=>{\n  const L=D.subeler.filter(s=>s.sy===sy);let ok=0,tot=0;\n  const per=M.map((m,j)=>{let p=0;L.forEach(s=>{if(stat(m,s.v[j])===2)p++});ok+=p;tot+=L.length;return p});\n  return {sy,n:L.length,per,pct:ok/tot};\n });\n const sb=sys.slice().sort((a,b)=>b.pct-a.pct);\n let h='\u003cdiv class=\"an\">\u003cb>\u00d6zet\u003c/b>\u003cp>Hedefte olan \u015fube say\u0131s\u0131 en y\u00fcksek ba\u015fl\u0131k \u003cb>'+best.m.a+'\u003c/b> ('+best.c[2]+'/'+N+'), en d\u00fc\u015f\u00fck ba\u015fl\u0131k \u003cb>'+worst.m.a+'\u003c/b> ('+worst.c[2]+'/'+N+').\u003c/p>'\n +(weak.length?'\u003cp>\u015eubelerin \u00fc\u00e7te birinden az\u0131n\u0131n hedefte oldu\u011fu ba\u015fl\u0131klar: \u003cb>'+weak.join(', ').replace(/\\.$/,'')+'\u003c/b>.\u003c/p>':'')\n +'\u003cp>12 ba\u015fl\u0131\u011f\u0131n tamam\u0131 birlikte bak\u0131ld\u0131\u011f\u0131nda hedefte olan kutu pay\u0131 en y\u00fcksek SY \u003cb>'+esc(sb[0].sy)+'\u003c/b> (%'+Math.round(sb[0].pct*100)+'), en d\u00fc\u015f\u00fck \u003cb>'+esc(sb[sb.length-1].sy)+'\u003c/b> (%'+Math.round(sb[sb.length-1].pct*100)+').\u003c/p>\u003c/div>';\n h+='\u003ch2>Ba\u015fl\u0131k baz\u0131nda\u003c/h2>';\n h+=R.map(r=>{\n  const [lo,mid,hi]=r.c;const two=!r.m.th;\n  const bar='\u003cdiv class=\"bar\">\u003ci class=\"bg\" style=\"width:'+hi/N*100+'%\">\u003c/i>'+(two?'':'\u003ci class=\"ba\" style=\"width:'+mid/N*100+'%\">\u003c/i>')+'\u003ci class=\"br\" style=\"width:'+lo/N*100+'%\">\u003c/i>\u003c/div>';\n  return '\u003cdiv class=\"card\">\u003cdiv class=\"ah\">\u003cb>'+r.m.l+'\u003c/b>\u003cspan>'+esik(r.m)+'\u003c/span>\u003c/div>'+bar\n  +'\u003cdiv class=\"ac\">\u003cspan class=\"g\">Hedefte '+hi+'\u003c/span>'+(two?'':'\u003cspan class=\"a\">%85\u2013100: '+mid+'\u003c/span>')+'\u003cspan class=\"r\">Hedef alt\u0131 '+(two?lo:lo+mid)+(two?'':' (&lt;%85: '+lo+')')+'\u003c/span>\u003c/div>'\n  +'\u003cdiv class=\"al\">En d\u00fc\u015f\u00fck: '+r.low.map(s=>esc(s.ad)+' '+fmt(r.m,s.v[r.j])).join(' \u00b7 ')+'\u003c/div>\u003cdiv class=\"tg\">\u25be \u015eube detay\u0131n\u0131 g\u00f6ster\u003c/div>\u003cdiv class=\"det\">'+grp(r)+'\u003c/div>\u003c/div>';\n }).join('');\n h+='\u003ch2>SY baz\u0131nda hedefte olan \u015fube\u003c/h2>\u003cdiv class=\"wrapf\">\u003ctable class=\"tbl fit\">\u003cthead>\u003ctr>\u003cth>\u003c/th>'+sys.map(x=>'\u003cth>'+esc(x.sy.split(' ')[0])+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u015eube\u003c/td>'+sys.map(x=>'\u003ctd style=\"color:var(--mut)\">'+x.n+'\u003c/td>').join('')+'\u003c/tr>'\n +M.map((m,j)=>'\u003ctr>\u003ctd>'+lab(m)+'\u003c/td>'+sys.map(x=>{const p=x.per[j]/x.n;return '\u003ctd class=\"'+(p>=2/3?'gs':p>1/3?'as':'rs')+'\" style=\"color:#fff\">'+x.per[j]+'/'+x.n+'\u003c/td>'}).join('')+'\u003c/tr>').join('')\n +'\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"cnt\">Renk: SY i\u00e7inde hedefte olan \u015fube pay\u0131 \u2265 %67 ye\u015fil, %34\u201366 sar\u0131, \u2264 %33 k\u0131rm\u0131z\u0131.\u003c/div>';\n app.innerHTML=h;\n app.querySelectorAll('.card .tg').forEach(t=>t.onclick=()=>{const c=t.parentElement;c.classList.toggle('ao');t.textContent=c.classList.contains('ao')?'\u25b4 Gizle':'\u25be \u015eube detay\u0131n\u0131 g\u00f6ster'});\n}\nfunction render(){\n document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));\n ({sube:viewSube,sy:viewSy,ozet:viewOzet,analiz:viewAnaliz})[tab]();\n applyMq();\n if(tab!=='ozet'&&tab!=='sube'){}\n}\ndocument.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo(0,0)});\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

/* Minimal XLSX reader (no deps): zip + DecompressionStream + DOMParser */
async function xlUnzip(buf){
 const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
 for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65600);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
 if(e<0)throw new Error('Geçerli bir Excel (.xlsx) dosyası değil');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
 for(let k=0;k<n;k++){
  if(dv.getUint32(p,true)!==0x02014b50)break;
  const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
  files[name]={meth,cs,off};p+=46+nl+el+cl;
 }
 const get=async name=>{
  const f=files[name];if(!f)return null;
  const lh=f.off,ds=lh+30+dv.getUint16(lh+26,true)+dv.getUint16(lh+28,true);
  const raw=u8.subarray(ds,ds+f.cs);
  if(f.meth===0)return new TextDecoder().decode(raw);
  const st=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new TextDecoder().decode(await new Response(st).arrayBuffer());
 };
 return {get,has:n=>!!files[n]};
}
const xlDom=s=>new DOMParser().parseFromString(s,'application/xml');
async function xlOpen(buf){
 const z=await xlUnzip(buf);
 const wb=xlDom(await z.get('xl/workbook.xml'));
 const rels=xlDom(await z.get('xl/_rels/workbook.xml.rels'));
 const rt={};for(const r of rels.getElementsByTagName('Relationship'))rt[r.getAttribute('Id')]=r.getAttribute('Target');
 const sheets=[];
 for(const s of wb.getElementsByTagName('sheet')){
  let rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
  let t=rt[rid]||'';t=t.startsWith('/')?t.slice(1):'xl/'+t;
  sheets.push({name:s.getAttribute('name'),path:t});
 }
 const ss=[];const sx=await z.get('xl/sharedStrings.xml');
 if(sx){for(const si of xlDom(sx).getElementsByTagName('si')){
  let t='';for(const x of si.getElementsByTagName('t')){let q=x.parentNode;if(q&&q.nodeName==='rPh')continue;t+=x.textContent}ss.push(t)}}
 return {sheets,async sheet(name){
  const sh=sheets.find(s=>s.name===name);if(!sh)throw new Error('Sekme yok: '+name);
  const d=xlDom(await z.get(sh.path));const cells={};
  for(const c of d.getElementsByTagName('c')){
   const r=c.getAttribute('r'),t=c.getAttribute('t');let v=null;
   if(t==='inlineStr'){v=c.textContent}
   else{const ve=c.getElementsByTagName('v')[0];if(ve){const x=ve.textContent;
    if(t==='s')v=ss[+x];else if(t==='str')v=x;else if(t==='b')v=x==='1';else if(t==='e')v=null;else v=Number(x)}}
   cells[r]=v;
  }
  const colL=n=>{let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
  return (r,c)=>{const v=cells[colL(c)+r];return v===undefined?null:v};
 }};
}
function xlBuild(cell,gun,baslik){
 const keys=['sp','iot','term','akt','aks','swdo','akg','sol','rekont','egyg','mma','sabit'];
 const row=r=>{const a=[];for(let c=5;c<=16;c++)a.push(cell(r,c));return a};
 const subeler=[];for(let r=4;r<=57;r++)subeler.push({sy:cell(r,2),kod:cell(r,3),ad:cell(r,4),v:row(r),durum:cell(r,17)});
 const lab=['985 ORTALAMASI','639 ORTALAMASI','1469 ORTALAMASI','ŞİRKET ORTALAMASI','TR ORTALAMASI'];
 const ort=lab.map((l,i)=>({ad:l,v:row(58+i)}));
 const sy=[];for(let r=66;r<=71;r++)sy.push({ad:cell(r,4),n:cell(r,3),v:row(r)});
 const notlar=[];for(let r=73;r<=76;r++)notlar.push(cell(r,2));
 return {baslik,gun,subeler,ort,sy,notlar,keys};
}
function xlCheck(D){
 const e=[];const num=x=>typeof x==='number'&&isFinite(x);
 if(D.subeler.some(s=>!s.ad||!s.kod))e.push('Şube adı/kodu eksik satır var (satır 4–57)');
 const full=D.subeler.filter(s=>s.v.every(num)).length;
 if(full<40)e.push('Tam veri satırı sayısı beklenenden az: '+full+'/54');
 D.ort.forEach(o=>{if(!o.v.slice(0,12).some(num))e.push(o.ad+' satırı boş')});
 if(!D.sy.every(s=>s.ad))e.push('SY satırları (66–71) okunamadı');
 return e;
}

 return {baslik:D.baslik,gun:D.gun,subeler:D.subeler.map(s=>({kod:s.kod,ad:s.ad,v:s.v,durum:s.durum})),

function build(D,m){const s=APPS[m];const d=m==='m'?toMudur(D):D;
 const a=s.indexOf('const D=')+8,b=s.indexOf(';\n',a);
 return (s.slice(0,a)+JSON.stringify(d).replace(/</g,'\\u003c')+s.slice(b)).split('__GUN__').join(String(D.gun));}
function valid(D){return D&&Array.isArray(D.subeler)&&D.subeler.length>0&&Array.isArray(D.ort)&&D.ort.length===5&&Array.isArray(D.sy)&&Array.isArray(D.notlar)&&typeof D.gun==='number'}

const ck='gcache_'+KEY;
async function load(){
 try{const x=await fget(KEY);note='';
  if(!x){fail(FIXED==='sy'?'Henüz veri yok. "Excel yükle" ile günün dosyasını yükleyin.':'Henüz veri yayınlanmadı.');status();return}

 }catch(e){note=' · çevrimdışı';status();fail('Veriye ulaşılamıyor. İnternet bağlantınızı kontrol edin.')}
}
if(!okKey(KEY)){fail('Bağlantı eksik ya da hatalı. Size gönderilen bağlantının tamamını açın.')}
else{
 try{const c=JSON.parse(localStorage.getItem(ck)||'null');if(c&&typeof c.j==='string'){note=' · kayıtlı kopya';setData(c.j,c.t)}}catch(e){}
 load();setInterval(load,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openUp(){pending=null;$('oy').disabled=true;ob.innerHTML='<p><b>Excel yükle</b><br>Excel dosyasını (.xlsx) seçin. En son günün sekmesi otomatik seçilir.</p><input type="file" id="fi" accept=".xlsx"><div id="res"></div>';$('ov').style.display='flex';
 $('fi').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const res=$('res');res.innerHTML='Okunuyor…';
  try{const wb=await xlOpen(await f.arrayBuffer());
   const m=wb.sheets.map(s=>({n:s.name,g:(/^\s*(\d{1,2})\s+\S+\s*$/.exec(s.name)||[])[1]})).filter(x=>x.g);
   if(!m.length)throw new Error('"23 KASIM" biçiminde günlük sekme bulunamadı');
   m.sort((a,b)=>+b.g-+a.g);
   res.innerHTML='<p>Sekme: <select id="sl">'+m.map(x=>'<option>'+esc(x.n)+'</option>').join('')+'</select></p><div id="pv"></div>';
   const run=async()=>{const nm=$('sl').value,g=+m.find(x=>x.n===nm).g;pending=null;$('oy').disabled=true;
    try{const cell=await wb.sheet(nm);const D=xlBuild(cell,g,String(cell(2,3)||nm));const er=xlCheck(D);
     const sir=D.ort[3].v,fm=x=>typeof x==='number'?Math.round(x*100)+'%':'-';
     $('pv').innerHTML='<div class="'+(er.length?'er':'ok')+'"><b>'+esc(D.baslik)+'</b> · '+D.subeler.length+' şube · Şirket SP '+fm(sir[0])+' · Aktivasyon '+fm(sir[3])+' · SOL '+fm(sir[7])+'</div>'+
      (er.length?'<div class="er">'+er.map(esc).join('<br>')+'<br>Bu hatalar düzelmeden yayınlanamaz.</div>':'')+
      (cur&&cur.gun>g?'<div class="w">Dikkat: yayındaki veri '+esc(cur.baslik)+' — seçilen sekme daha eski bir gün.</div>':'')+
      '<div>Yayındaki: '+(cur?esc(cur.baslik):'yok')+'</div>';
     if(!er.length){pending=D;$('oy').disabled=false}
    }catch(e){$('pv').innerHTML='<div class="er">'+esc(e.message)+'</div>'}};
   $('sl').onchange=run;await run();
  }catch(e){res.innerHTML='<div class="er">'+esc(e.message)+'</div>'}};
}
$('bUp').onclick=openUp;$('oc').onclick=()=>{$('ov').style.display='none'};
$('oy').onclick=async()=>{if(!pending)return;$('oy').disabled=true;
 try{const P=pending,tm=Date.now();await fput(KEY,{t:tm,j:JSON.stringify(P)});const M=Object.assign({},P,{sy:[],notlar:[],subeler:P.subeler.map(x=>Object.assign({},x,{sy:''}))});await fput(MKEY,{t:tm,j:JSON.stringify(M)});ob.innerHTML='<div class="ok"><b>Yayınlandı.</b> SY ve müdür bağlantılarını açan herkes '+esc(P.baslik)+' verisini görecek (en geç 1 dakikada).</div>';pending=null;load()}
 catch(e){ob.insertAdjacentHTML('beforeend','<div class="er">Kaydedilemedi ('+esc(e&&e.code||'hata')+'). '+(e&&(e.code===401||e.code===403)?'Firebase kuralları yazmaya izin vermiyor.':'İnternet bağlantısını kontrol edip tekrar deneyin.')+'</div>');$('oy').disabled=false}};
</script></body></html>
